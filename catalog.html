<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUND SHOP | Zander Johnson</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@100;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --studio-black: #020202;
            --panel-gray: #0d0d0d;
            --neon-teal: #00ffcc;
            --wu-gold: #fdbb2d;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--studio-black);
            color: #ffffff;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.03) 0%, transparent 80%);
        }

        /* HUD NAVIGATION */
        .catalog-hud {
            display: grid; grid-template-columns: 1fr 1fr;
            background: #000; border-bottom: 2px solid var(--neon-teal);
            position: sticky; top: 0; z-index: 2000;
        }
        .hud-link {
            padding: 15px 5px; text-align: center; text-decoration: none; color: #fff;
            font-size: 0.6rem; text-transform: uppercase; font-weight: 900; letter-spacing: 2px;
        }
        .hud-link span { display: block; font-size: 0.4rem; color: var(--neon-teal); font-family: 'Syncopate'; }

        header { padding: 40px 20px; text-align: center; }
        header h1 { font-family: 'Syncopate'; font-size: 1.2rem; letter-spacing: 10px; color: #fff; }

        .container { max-width: 900px; margin: auto; padding: 10px; }

        /* POSTER-FIRST VIDEO SECTION */
        .video-section {
            margin-bottom: 40px; background: var(--panel-gray);
            border: 1px solid #1a1a1a; padding: 15px; border-radius: 4px;
            text-align: center;
        }
        .video-container {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            background: url('https://images.unsplash.com/photo-1507502707541-f369a3b18502?auto=format&fit=crop&w=1000&q=80') center/cover;
            border: 1px solid var(--neon-teal);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Play button overlay to show it's clickable */
        .video-container::before {
            content: '▶';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: var(--neon-teal);
            z-index: 3;
            text-shadow: 0 0 15px var(--neon-teal);
            opacity: 0.8;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 5; }

        /* AUDIO RACK */
        .audio-rack {
            background: var(--panel-gray); border: 1px solid #1a1a1a;
            border-left: 4px solid var(--neon-teal); padding: 20px; margin-bottom: 20px;
        }
        .track-info { display: flex; justify-content: space-between; font-size: 0.5rem; color: #666; margin-top: 5px; }

        .visualizer-screen {
            height: 80px; background: #000; display: flex; align-items: flex-end; 
            justify-content: center; gap: 3px; margin-bottom: 15px; border: 1px solid #151515;
        }
        .wave-bar { width: 6px; height: 10%; background: var(--neon-teal); opacity: 0.3; transition: height 0.05s ease; }

        audio { width: 100%; filter: invert(1) hue-rotate(150deg); height: 40px; margin-bottom: 15px; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cta-btn {
            padding: 14px; text-align: center; text-decoration: none; font-weight: 900;
            font-size: 0.6rem; text-transform: uppercase; border-radius: 2px;
        }
        .wu-buy { background: var(--wu-gold); color: #000; }
        .call-company { border: 1px solid var(--neon-teal); color: var(--neon-teal); }

        footer { text-align: center; padding: 40px; font-size: 0.5rem; color: #333; letter-spacing: 4px; }
    </style>
</head>
<body>

<div class="catalog-hud">
    <a href="tel:19108796800" class="hud-link"><span>Direct Order</span>Call Now</a>
    <a href="https://www.westernunion.com/us/en/send-money/start.html" target="_blank" class="hud-link" style="color:var(--wu-gold)"><span>Checkout</span>WU Portal</a>
</div>

<header>
    <h1>SOUND SHOP</h1>
    <p style="font-size:0.5rem; color:var(--neon-teal); letter-spacing:3px;">ZANDER JOHNSON PRODUCTIONS</p>
</header>

<div class="container">
    <div class="video-section">
        <p style="font-family:'Syncopate'; font-size:0.55rem; color:var(--neon-teal); margin-bottom:15px; letter-spacing:3px;">SPIRITUAL GUIDANCE: GOD IS IN CONTROL</p>
        <!-- The image is now the trigger. The video ONLY loads when clicked. -->
        <div class="video-container" id="videoBox" onclick="loadVideo()"></div>
    </div>

    <div id="catalog-container"></div>

    <div style="text-align:center; padding: 40px; border: 2px dashed #222;">
        <div style="font-family:'Syncopate'; font-size:0.7rem; letter-spacing:4px;">CATALOG UPDATES</div>
        <a onclick="alert('New instrumentals added every 24 hours at 12:00 AM EST.')" style="display: inline-block; margin-top: 20px; padding: 12px 25px; border: 1px solid var(--neon-teal); color: var(--neon-teal); text-decoration: none; font-family: 'Syncopate'; font-size: 0.6rem; cursor: pointer;">Check Timeframe</a>
    </div>
</div>

<footer>&copy; 2026 | ZANDER JOHNSON | RSA-2048 SECURE</footer>

<script>
    // POSTER-FIRST LOGIC: Load the YouTube iframe ONLY after a click
    function loadVideo() {
        const box = document.getElementById('videoBox');
        box.innerHTML = '<iframe src="https://www.youtube.com/embed/S_I_6Yx9Nis?autoplay=1&rel=0" title="Spiritual Guidance" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
        box.style.background = "black"; // Switch to black when video starts
    }

    const tracks = [
        { name: "CRND", file: "crnd.m4a", bpm: "140", key: "C Minor" },
        { name: "Highrise", file: "highrise.m4a", bpm: "128", key: "G# Major" },
        { name: "Botrix", file: "botrix.m4a", bpm: "145", key: "F Major" },
        { name: "Electro", file: "electro.m4a", bpm: "130", key: "D Minor" },
        { name: "Wavetoxton", file: "wavetoxton.m4a", bpm: "138", key: "A# Minor" },
        { name: "G-Smoke", file: "gsmoke.m4a", bpm: "95", key: "E Minor" },
        { name: "Fear Not", file: "fearnot.m4a", bpm: "142", key: "B Major" },
        { name: "Spaceroids", file: "spaceroids.m4a", bpm: "120", key: "C Major" },
        { name: "This Poppin", file: "thispoppin.m4a", bpm: "100", key: "G Minor" },
        { name: "The Grudge", file: "tgg.m4a", bpm: "148", key: "F# Minor" },
        { name: "Empty Grave", file: "emptygrave.m4a", bpm: "88", key: "D Major" },
        { name: "Holden HW", file: "holdenhw.m4a", bpm: "140", key: "A Minor" },
        { name: "SM", file: "sm.m4a", bpm: "135", key: "C# Minor" },
        { name: "POE", file: "poe.m4a", bpm: "125", key: "E Major" },
        { name: "Creep", file: "creep.m4a", bpm: "140", key: "B Minor" }
    ];

    const container = document.getElementById('catalog-container');
    let audioCtx;

    tracks.forEach((track, index) => {
        const rack = document.createElement('div');
        rack.className = 'audio-rack';
        rack.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
                <div style="font-family:'Syncopate'; font-size:0.7rem; color:var(--neon-teal);">${track.name}</div>
                <div style="font-size:0.4rem; color:#444;">ID: SS-${index+1}</div>
            </div>
            <div class="track-info">
                <span>BPM: ${track.bpm}</span><span>KEY: ${track.key}</span>
            </div>
            <div class="visualizer-screen" id="viz-${index}">
                ${'<div class="wave-bar"></div>'.repeat(20)}
            </div>
            <audio id="audio-${index}" controls>
                <source src="audio/${track.file}" type="audio/mp4">
            </audio>
            <div class="action-grid">
                <a href="https://www.westernunion.com/us/en/send-money/start.html" target="_blank" class="cta-btn wu-buy">WU Checkout</a>
                <a href="tel:19108796800" class="cta-btn call-company">Call Company</a>
            </div>
        `;
        container.appendChild(rack);
        
        const audio = document.getElementById(`audio-${index}`);
        audio.onplay = () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            const analyzer = audioCtx.createAnalyser();
            source.connect(analyzer);
            analyzer.connect(audioCtx.destination);
            analyzer.fftSize = 64;
            const dataArray = new Uint8Array(analyzer.frequencyBinCount);
            const bars = document.getElementById(`viz-${index}`).getElementsByClassName('wave-bar');
            function draw() {
                if (audio.paused) return;
                requestAnimationFrame(draw);
                analyzer.getByteFrequencyData(dataArray);
                for (let i = 0; i < bars.length; i++) {
                    const h = (dataArray[i % 32] / 255) * 100;
                    bars[i].style.height = Math.max(10, h) + '%';
                }
            }
            draw();
        };
    });
</script>
</body>
</html>
