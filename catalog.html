<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEAT CATALOG | Sound Shop</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CQ81083J1M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CQ81083J1M');
    </script>
    
    <script src="https://web.squarecdn.com/v1/payments.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap');
        :root { --teal: #00ffcc; --dark: #020202; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--dark); color: #ffffff; font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; 
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=2000');
            background-size: cover; background-attachment: fixed; background-position: center;
        }

        nav { padding: 30px 20px; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(30px); border-bottom: 1px solid rgba(0, 255, 204, 0.2); }
        .logo { font-weight: 900; letter-spacing: 5px; font-size: 1.2rem; text-transform: uppercase; font-style: italic; }
        .logo span { color: var(--teal); }
        .nav-links a { text-decoration: none; color: #fff; font-size: 0.6rem; margin-left: 15px; letter-spacing: 2px; font-weight: 700; opacity: 0.6; transition: 0.4s; }
        .nav-links a:hover { opacity: 1; color: var(--teal); }

        .content-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .experience-header { text-align: center; margin-bottom: 40px; }
        .experience-header h1 { font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; line-height: 0.9; margin: 0; }
        .experience-header p { color: var(--teal); letter-spacing: 6px; font-size: 0.7rem; text-transform: uppercase; margin-top: 10px; }

        .track-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 24px; backdrop-filter: blur(20px); margin-bottom: 25px; border-left: 4px solid var(--teal); }
        .track-card h2 { font-style: italic; color: var(--teal); margin-bottom: 5px; text-transform: uppercase; font-size: 1.5rem; }
        .track-card p.sku { font-size: 0.6rem; opacity: 0.4; letter-spacing: 2px; margin-bottom: 15px; }
        
        audio { width: 100%; height: 45px; margin: 15px 0; border-radius: 50px; filter: invert(1) hue-rotate(180deg); }
        
        .buy-btn { background: linear-gradient(90deg, #00ffcc, #00c6ff); color: #000; border: none; padding: 18px; width: 100%; border-radius: 50px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2); }

        #paymentModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:2000; justify-content:center; align-items:center; }
        .modal-content { background:#111; border:2px solid var(--teal); padding:35px; border-radius:28px; width:90%; max-width:400px; }
        input { width:100%; padding:15px; margin:10px 0; border-radius:12px; border:1px solid #333; background:#1a1a1a; color:#fff; font-size: 16px; box-sizing: border-box; }

        #card-container { margin: 20px 0; min-height: 120px; }

        #toast { visibility: hidden; min-width: 250px; background-color: var(--teal); color: #000; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 3000; bottom: 30px; left: 50%; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        footer { text-align: center; padding: 60px 20px; color: #444; font-size: 0.6rem; letter-spacing: 4px; font-weight: 900; }
    </style>
</head>
<body>

<nav>
    <div class="logo">SOUND<span>SHOP</span></div>
    <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="catalog.html" style="color: var(--teal); opacity: 1;">BEATS</a>
        <a href="shop.html">GEAR</a>
        <a href="about.html">STORY</a>
    </div>
</nav>

<div class="content-container">
    <div class="experience-header">
        <p>PREMIUM INSTRUMENTALS</p>
        <h1>BEAT <br> CATALOG.</h1>
    </div>

    <div id="product-container"></div>
</div>

<div id="paymentModal">
    <div class="modal-content">
        <h3 id="modalTrackName" style="color:var(--teal); margin-top:0; font-style: italic;">Item Name</h3>
        <p id="modalPrice" style="font-weight: 900; font-size: 1.4rem; margin-bottom: 10px;">$0.00</p>
        
        <input type="email" id="customerEmail" placeholder="Email for Delivery">
        
        <div id="card-container"></div>
        
        <button class="buy-btn" id="card-button" type="button" onclick="handlePayment()">Complete Secure Purchase</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#666; width:100%; margin-top:20px; cursor:pointer;">Cancel</button>
    </div>
</div>

<div id="toast">Action Complete</div>

<footer>SOUND SHOP // FAYETTEVILLE NC </footer>

<script>
    const audioTracks = [
        { name: "Undefeated", price: "29.99", sku: "SKU-UND", file: "audio/undftd.m4a" },
        { name: "NMC", price: "24.99", sku: "SKU-NMC", file: "audio/nmc.m4a" },
        { name: "Stormwind", price: "29.99", sku: "SKU-STR", file: "audio/strmnd.m4a" },
        { name: "First Mill", price: "34.99", sku: "SKU-FML", file: "audio/frstmill.m4a" },
        { name: "Crowned", price: "24.99", sku: "SKU-CRN", file: "audio/crnd.m4a" },
        { name: "High Rise", price: "24.99", sku: "SKU-HGR", file: "audio/highrise.m4a" },
        { name: "Botrix", price: "19.99", sku: "SKU-BTX", file: "audio/botrix.m4a" },
        { name: "Electro", price: "19.99", sku: "SKU-ELC", file: "audio/electro.m4a" },
        { name: "Wave Toxton", price: "29.99", sku: "SKU-WVT", file: "audio/wavetoxton.m4a" },
        { name: "Smoked", price: "24.99", sku: "SKU-SMK", file: "audio/gsmoke.m4a" },
        { name: "Fear Not", price: "24.99", sku: "SKU-FNT", file: "audio/fearnot.m4a" },
        { name: "Spaceroids", price: "29.99", sku: "SKU-SPD", file: "audio/spaceroids.m4a" },
        { name: "This Poppin", price: "19.99", sku: "SKU-TPP", file: "audio/thispoppin.m4a" },
        { name: "Grudge Gobbler", price: "14.99", sku: "SKU-TGG", file: "audio/tgg.m4a" },
        { name: "Empty Grave", price: "24.99", sku: "SKU-EGV", file: "audio/emptygrave.m4a" },
        { name: "Holding Heavy Weight", price: "29.99", sku: "SKU-HHW", file: "audio/holdenhw.m4a" },
        { name: "The Rumbler", price: "24.99", sku: "SKU-RUM", file: "audio/rumbler.m4a" },
        { name: "Z-Bung", price: "19.99", sku: "SKU-ZBG", file: "audio/zjbng.m4a" },
        { name: "SM", price: "19.99", sku: "SKU-SMX", file: "audio/sm.m4a" },
        { name: "Bung", price: "14.99", sku: "SKU-BNG", file: "audio/bng.m4a" },
        { name: "Poe", price: "14.99", sku: "SKU-POE", file: "audio/poe.m4a" },
        { name: "Creep", price: "19.99", sku: "SKU-CRP", file: "audio/creep.m4a" },
        { name: "IJDGAF", price: "49.99", sku: "SKU-IJG", file: "audio/ijdgaf.m4a" }
    ];

    const container = document.getElementById('product-container');
    
    audioTracks.forEach(track => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'track-card';
        cardDiv.innerHTML = `
            <h2>${track.name}</h2>
            <p class="sku">${track.sku}</p>
            <audio controls preload="none" controlsList="nodownload">
                <source src="${track.file}" type="audio/mp4">
            </audio>
            <button class="buy-btn" onclick="openModal('${track.name}', '${track.price}', '${track.sku}')">
                LICENSE BEAT - $${track.price}
            </button>
        `;
        container.appendChild(cardDiv);
    });

    let currentOrder = {};
    let card; 

    // INITIALIZED WITH PRODUCTION CREDENTIALS
    async function initializeSquare() {
        try {
            const payments = Square.payments('sq0idp-65zuXXwmtAkENq9dLUBdiw', 'LMPQXX1');
            card = await payments.card();
            await card.attach('#card-container');
        } catch (e) {
            console.error('Square Initialization Failed', e);
        }
    }

    initializeSquare();

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message; toast.className = "show";
        setTimeout(() => { toast.className = ""; }, 3000);
    }

    function openModal(name, price, sku) {
        currentOrder = { name, price, sku };
        document.getElementById('modalTrackName').innerText = name;
        document.getElementById('modalPrice').innerText = '$' + price;
        document.getElementById('paymentModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('paymentModal').style.display = 'none'; }

    async function handlePayment() {
        const btn = document.getElementById('card-button');
        const email = document.getElementById("customerEmail").value;
        
        if (!email) { showToast("Email required for delivery."); return; }
        
        btn.innerText = "PROCESSING..."; btn.disabled = true;

        try {
            const result = await card.tokenize();
            if (result.status === 'OK') {
                processCheckout(result.token);
            } else {
                showToast("Card Error: " + result.errors[0].message);
                btn.disabled = false; btn.innerText = "Complete Secure Purchase";
            }
        } catch (e) {
            console.error('Square Tokenization Error:', e);
            showToast("Payment service error.");
            btn.disabled = false;
        }
    }

    async function processCheckout(token) {
        try {
            const res = await fetch('/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sourceId: token,
                    amount: currentOrder.price, 
                    customerEmail: document.getElementById("customerEmail").value,
                    items: [{ name: currentOrder.name, sku: currentOrder.sku }]
                })
            });

            const result = await res.json();
            if (result.success) {
                window.location.href = "success.html";
            } else {
                showToast("Error: " + result.error);
                document.getElementById('card-button').disabled = false;
                document.getElementById('card-button').innerText = "Complete Secure Purchase";
            }
        } catch (err) { 
            showToast("Server connection failed."); 
            document.getElementById('card-button').disabled = false;
            document.getElementById('card-button').innerText = "Complete Secure Purchase";
        }
    }
</script>
</body>
</html>
