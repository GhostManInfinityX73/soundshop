<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUND SHOP | Hybrid Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --teal: #00ffcc; 
            --dark: #050505; 
            --panel: rgba(255, 255, 255, 0.03); 
            --accent-gold: #fdbb2d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        /* HEADER & TRANSPORT */
        header { padding: 15px; border-bottom: 1px solid rgba(0, 255, 204, 0.2); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); z-index: 10; }
        .studio-logo { font-family: 'Syncopate'; font-size: 0.8rem; letter-spacing: 4px; color: var(--teal); }
        
        .transport-group { display: flex; gap: 10px; align-items: center; }
        .btn-transport { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 12px; border-radius: 4px; font-size: 0.6rem; font-weight: 900; }
        #display { font-family: monospace; color: var(--teal); background: #000; padding: 5px 10px; border-radius: 4px; border: 1px solid #222; min-width: 80px; text-align: center; }

        /* MAIN WORKSPACE */
        #main-view { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR EXPLORER */
        #sidebar { width: 160px; background: rgba(255,255,255,0.02); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
        .sidebar-label { padding: 10px; font-size: 0.5rem; font-weight: 900; letter-spacing: 2px; color: #555; background: #000; }
        .folder-item { padding: 12px; font-size: 0.65rem; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; color: #888; }
        .folder-item:hover { color: var(--teal); background: rgba(0,255,204,0.05); }

        /* CONTENT AREA */
        #content { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 10px; overflow-y: auto; }
        
        /* MONITOR & TIMELINE */
        .monitor-well { height: 120px; background: var(--panel); border: 1px solid rgba(0, 255, 204, 0.1); border-radius: 12px; position: relative; overflow: hidden; }
        .visualizer-overlay { position: absolute; bottom: 0; width: 100%; height: 60%; background: linear-gradient(transparent, rgba(0, 255, 204, 0.1)); }

        .track-strip { background: var(--panel); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; border-left: 4px solid var(--teal); margin-bottom: 8px; }
        .track-meta { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .track-name { font-size: 0.6rem; font-weight: 900; letter-spacing: 1px; color: var(--teal); }
        .track-file { font-size: 0.5rem; color: #555; }

        /* SLIDERS */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(255,255,255,0.1); }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--teal); margin-top: -6px; box-shadow: 0 0 8px var(--teal); }

        /* MIXER FOOTER */
        footer { height: 70px; background: #000; border-top: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; padding: 0 20px; gap: 20px; }
        .vu-meter { width: 30px; height: 40px; background: #111; border: 1px solid #333; position: relative; }
        .vu-bar { position: absolute; bottom: 0; width: 100%; background: var(--teal); height: 0%; transition: height 0.1s; }
    </style>
</head>
<body>

<header>
    <div class="studio-logo">SOUND SHOP STUDIO</div>
    <div class="transport-group">
        <button class="btn-transport" onclick="resetStudio()">◀◀</button>
        <button id="playBtn" class="btn-transport" onclick="toggleStudio()" style="border-color: var(--teal); color: var(--teal);">PLAY</button>
        <div id="display">00:00:00</div>
    </div>
</header>

<div id="main-view">
    <aside id="sidebar">
        <div class="sidebar-label">EXPLORER</div>
        <div class="folder-item">📂 DRUM KITS</div>
        <div class="folder-item">📂 SYNTHS</div>
        <div class="folder-item" style="color: var(--accent-gold);">📂 910 ROOTS</div>
    </aside>

    <main id="content">
        <div class="monitor-well">
            <div style="padding: 10px; font-size: 0.45rem; color: var(--teal); font-weight: 900; letter-spacing: 3px;">MASTER MONITOR</div>
            <div class="visualizer-overlay" id="viz"></div>
        </div>

        <div class="track-strip">
            <div class="track-meta">
                <div class="track-name">01 BOTRIX</div>
                <div class="track-file">botrix.m4a</div>
            </div>
            <input type="range" min="0" max="100" value="80">
        </div>

        <div class="track-strip" style="border-left-color: var(--accent-gold);">
            <div class="track-meta">
                <div class="track-name" style="color: var(--accent-gold);">02 THE UNKNOWN</div>
                <div class="track-file">theunknown.m4a</div>
            </div>
            <input type="range" min="0" max="100" value="70">
        </div>
    </main>
</div>

<footer>
    <div class="vu-meter">
        <div class="vu-bar" id="masterVU"></div>
    </div>
    <div style="flex: 1;">
        <p style="font-size: 0.5rem; letter-spacing: 2px; color: #444; margin-bottom: 5px;">MASTER OUTPUT</p>
        <input type="range" id="masterVol" min="0" max="100" value="75">
    </div>
    <button class="btn-transport" onclick="location.href='index.html'">EXIT</button>
</footer>

<script>
    let running = false;
    let time = 0;
    let timer;

    function toggleStudio() {
        const btn = document.getElementById('playBtn');
        const vu = document.getElementById('masterVU');
        
        if(!running) {
            running = true;
            btn.innerText = "STOP";
            timer = setInterval(() => {
                time += 10;
                updateDisplay();
                vu.style.height = (Math.random() * 60 + 20) + '%';
            }, 10);
        } else {
            running = false;
            btn.innerText = "PLAY";
            clearInterval(timer);
            vu.style.height = '0%';
        }
    }

    function resetStudio() {
        time = 0;
        updateDisplay();
        if(running) toggleStudio();
    }

    function updateDisplay() {
        let ms = Math.floor((time % 1000) / 10);
        let sec = Math.floor((time / 1000) % 60);
        let min = Math.floor(time / 60000);
        document.getElementById('display').innerText = 
            `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}:${ms.toString().padStart(2,'0')}`;
    }
</script>

</body>
</html>
