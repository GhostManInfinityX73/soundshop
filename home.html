<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUND SHOP | Infrastructure</title>

    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --teal: #00ffcc; 
            --dark: #050505; 
            --glass: rgba(255, 255, 255, 0.05); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--dark); 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
        }

        /* CRT SCANLINE EFFECT */
        body::before {
            content: " "; display: block; position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9998; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        .ticker {
            background: var(--teal); color: #000; white-space: nowrap;
            overflow: hidden; padding: 6px 0; font-size: 0.65rem;
            font-weight: 900; text-transform: uppercase; letter-spacing: 3px;
        }
        .ticker-content { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        nav { 
            padding: 20px; background: rgba(0, 0, 0, 0.9); 
            display: flex; flex-direction: column; gap: 15px;
            position: sticky; top: 0; z-index: 1000; 
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 255, 204, 0.2); 
        }

        .logo { 
            font-family: 'Syncopate', sans-serif; font-weight: 700; 
            letter-spacing: 8px; font-size: 1.2rem; text-transform: uppercase; text-align: center;
            background: linear-gradient(to right, #fff 20%, var(--teal) 50%, #fff 80%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% auto; animation: shine 4s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .nav-links { display: flex; overflow-x: auto; white-space: nowrap; gap: 20px; width: 100%; justify-content: center; }
        .nav-links a { text-decoration: none; color: #fff; font-size: 0.6rem; letter-spacing: 2px; font-weight: 700; opacity: 0.5; }

        /* CONTACT BAR */
        .contact-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; background: rgba(0, 255, 204, 0.05); }
        .call-btn { 
            flex: 1; text-align: center; padding: 12px; 
            border: 1px solid var(--teal); color: var(--teal); 
            text-decoration: none; border-radius: 5px; font-weight: 800; 
            font-size: 0.7rem; letter-spacing: 1px;
        }
        .order-btn { background: var(--teal); color: #000; }

        /* HERO WITH VIDEO BACKGROUND */
        .hero { 
            height: 35vh; position: relative;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .hero-video {
            position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            transform: translateX(-50%) translateY(-50%); z-index: 1; filter: brightness(0.25);
        }
        .hero-overlay {
            position: absolute; z-index: 2; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle, transparent 20%, var(--dark) 90%);
        }
        .hero-content { position: relative; z-index: 3; text-align: center; }
        .hero h1 { font-family: 'Syncopate', sans-serif; font-size: 2.2rem; font-weight: 700; letter-spacing: -1px; margin: 0; }

        /* YOUTUBE SECTION */
        .video-wrapper { width: 90%; max-width: 800px; margin: 30px auto; border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 15px; overflow: hidden; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .featured-container { padding: 20px; max-width: 900px; margin: 0 auto 40px; position: relative; z-index: 10; }
        .section-header { font-family: 'Syncopate'; font-size: 0.7rem; letter-spacing: 5px; text-align: center; margin-bottom: 25px; color: var(--teal); }

        /* TRACK CARDS */
        .track-card {
            background: var(--glass); border: 1px solid rgba(0, 255, 204, 0.15);
            border-radius: 20px; padding: 25px; margin-bottom: 30px;
            backdrop-filter: blur(15px); border-left: 5px solid var(--teal);
        }
        .track-title { font-family: 'Syncopate'; font-size: 0.85rem; letter-spacing: 2px; color: #fff; margin-bottom: 20px; }
        
        .btn-group { display: flex; gap: 10px; }
        .play-btn { 
            flex: 1; background: transparent; color: var(--teal); border: 1px solid var(--teal); 
            padding: 15px; border-radius: 10px; font-weight: 900; text-transform: uppercase; font-size: 0.7rem;
        }
        .buy-btn { 
            flex: 2; background: linear-gradient(90deg, var(--teal), #00c6ff); color: #000; 
            border: none; padding: 15px; border-radius: 10px; font-weight: 900; text-transform: uppercase; font-size: 0.7rem;
        }

        #chat-bubble {
            position: fixed; bottom: 25px; right: 25px; 
            background: var(--teal); width: 65px; height: 65px; 
            border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; cursor: pointer; z-index: 9999;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        #toast { visibility: hidden; min-width: 250px; background-color: var(--teal); color: #000; text-align: center; border-radius: 5px; padding: 15px; position: fixed; z-index: 10000; bottom: 100px; left: 50%; transform: translateX(-50%); font-weight: bold; font-size: 0.7rem; text-transform: uppercase; }
        #toast.show { visibility: visible; }
        
        footer { padding: 40px 20px; text-align: center; color: #444; font-size: 0.5rem; letter-spacing: 4px; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="chat-bubble" onclick="showToast('Opening Support...')">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3">

<script>
    function playPreview(audioId, button) {
        const audio = document.getElementById(audioId);
        
        // Stop all other audio tracks
        document.querySelectorAll('audio').forEach(a => {
            if (a.id !== audioId) {
                a.pause();
                a.currentTime = 0;
            }
        });
        
        // Reset all play buttons
        document.querySelectorAll('.play-btn').forEach(btn => {
            if (btn !== button) btn.innerText = "Play Preview";
        });

        if (audio.paused) {
            audio.play().then(() => {
                button.innerText = "Pause";
            }).catch(e => {
                console.error("Playback Error:", e);
                showToast("File not found in root or /audio/");
            });
        } else {
            audio.pause();
            button.innerText = "Play Preview";
        }
    }

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg; t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }
</script>
