<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUND SHOP | Premium Audio Infrastructure</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CQ81083J1M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CQ81083J1M');
    </script>

    <script type="text/javascript" src="https://js.authorize.net/v1/Accept.js" charset="utf-8"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap');
        :root { --teal: #00ffcc; --dark: #020202; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--dark); color: #ffffff; font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; 
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=2000');
            background-size: cover; background-attachment: fixed; background-position: center;
        }

        nav { padding: 20px; background: rgba(0, 0, 0, 0.9); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 255, 204, 0.2); }
        .logo { font-weight: 900; letter-spacing: 3px; font-size: 1rem; text-transform: uppercase; font-style: italic; }
        .logo span { color: var(--teal); }
        .nav-links a { text-decoration: none; color: #fff; font-size: 0.65rem; margin-left: 10px; letter-spacing: 1px; font-weight: 700; opacity: 0.6; }
        
        .hero { height: 35vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        .hero h1 { font-size: 3rem; font-weight: 900; letter-spacing: -2px; line-height: 0.9; margin:0; }
        .hero p { color: var(--teal); letter-spacing: 5px; font-size: 0.7rem; text-transform: uppercase; margin-top: 10px; }

        /* YOUTUBE SECTION */
        .video-wrapper { width: 95%; max-width: 800px; margin: 20px auto; border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 15px; overflow: hidden; background: #000; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .media-hub { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .video-card { background: var(--glass); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        
        .track-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 24px; backdrop-filter: blur(20px); margin-bottom: 20px; border-left: 4px solid var(--teal); }
        audio { width: 100%; filter: invert(100%) hue-rotate(180deg) brightness(1.5); margin: 15px 0; }
        
        .buy-btn { background: linear-gradient(90deg, #00ffcc, #00c6ff); color: #000; border: none; padding: 15px; width: 100%; border-radius: 50px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; text-align: center; text-decoration: none; display: block; }

        #paymentModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:2000; justify-content:center; align-items:center; }
        .modal-content { background:#111; border:2px solid var(--teal); padding:25px; border-radius:28px; width:90%; max-width:400px; }
        input { width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #333; background:#1a1a1a; color:#fff; }

        #toast { visibility: hidden; min-width: 200px; background-color: var(--teal); color: #000; text-align: center; border-radius: 50px; padding: 12px; position: fixed; z-index: 3000; bottom: 30px; left: 50%; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; }
        
        footer { text-align: center; padding: 40px 20px; color: #444; font-size: 0.5rem; letter-spacing: 3px; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body>

<nav>
    <div class="logo">SOUND<span>SHOP</span></div>
    <div class="nav-links">
        <a href="index.html" style="color: var(--teal); opacity: 1;">HOME</a>
        <a href="catalog.html">BEATS</a>
        <a href="shop.html">GEAR</a>
        <a href="portal.html">LOUNGE</a>
    </div>
<a href="lab.html">The Lab</a></nav>

<div class="hero">
    <p>PREMIUM AUDIO INFRASTRUCTURE</p>
    <h1>SOUND<br>SHOP.</h1>
</div>

<section class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/GjZ_59hCrx0" title="Studio Vision" allowfullscreen></iframe>
    </div>
</section>

<div class="media-hub">
    <div class="video-card" style="text-align: center;">
        <h3 style="color: #e50914; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 5px;">STREAMING PLACEMENTS</h3>
        <p style="font-size: 0.7rem; opacity: 0.6; margin-bottom: 20px;">Featured content on Netflix & beyond.</p>
        <a href="https://www.netflix.com" target="_blank" class="buy-btn" style="background: #e50914; color: white;">WATCH ON NETFLIX</a>
    </div>

    <div id="product-container"></div>
</div>

<div id="paymentModal">
    <div class="modal-content">
        <h3 id="modalTrackName" style="color:var(--teal); margin-top:0;">Item Name</h3>
        <p id="modalPrice" style="font-weight: 900; font-size: 1.2rem;">$0.00</p>
        <input type="email" id="customerEmail" placeholder="Email for Delivery">
        <input type="tel" id="cardNumber" placeholder="Card Number">
        <div style="display:flex; gap:10px;">
            <input type="tel" id="expMonth" placeholder="MM" maxlength="2">
            <input type="tel" id="expYear" placeholder="YY" maxlength="2">
            <input type="tel" id="cardCode" placeholder="CVV" maxlength="4">
        </div>
        <button class="buy-btn" onclick="sendPayment()">Complete Purchase</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#666; width:100%; margin-top:15px;">Cancel</button>
    </div>
</div>

<div id="toast">Action Complete</div>

<footer>SOUND SHOP // FAYETTEVILLE NC // MMXXVI</footer>

<script>
    // Hardcoded to keep the site stable on Android storage paths
    const featuredTracks = [
        { id: 5, title: "Grudge Gobbler", price: "19.99", file: "audio/grudgegobbler.m4a" },
        { id: 7, title: "The Rumbler", price: "24.99", file: "audio/rumbler.m4a" },
        { id: 2, title: "Holding Heavy Weight", price: "29.99", file: "audio/holdenhw.m4a" }
    ];

    const container = document.getElementById('product-container');

    featuredTracks.forEach(track => {
        container.innerHTML += `
            <div class="track-card">
                <h2 style="color: var(--teal); font-style: italic; font-size: 1.2rem;">${track.title}</h2>
                <p style="font-size: 0.6rem; opacity: 0.4; letter-spacing: 2px;">PRODUCT ID: 00${track.id}</p>
                <audio controls controlsList="nodownload">
                    <source src="${track.file}" type="audio/mp4">
                </audio>
                <button class="buy-btn" onclick="openModal('${track.title}', '${track.price}', '${track.id}')">
                    SECURE LICENSE - $${track.price}
                </button>
            </div>
        `;
    });

    let currentOrder = {};
    function openModal(name, price, id) {
        currentOrder = { name, price, id };
        document.getElementById('modalTrackName').innerText = name;
        document.getElementById('modalPrice').innerText = '$' + price;
        document.getElementById('paymentModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('paymentModal').style.display = 'none'; }
    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg; t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }

    function sendPayment() {
        showToast("Processing Secure Payment...");
        setTimeout(() => closeModal(), 2000);
    }
</script>
</body>
</html>
