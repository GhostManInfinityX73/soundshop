<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Shop Widget</title>
  <style>
    #chat-bubble {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, #2d5a27, #004d00);
      border: 2px solid #50c878;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: 'Arial', sans-serif;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 100, 0, 0.4);
      transition: transform 0.3s ease;
      z-index: 9999;
      overflow: hidden;
      font-weight: bold;
      font-size: 1.2rem;
    }
    #chat-bubble:hover {
      transform: scale(1.1);
    }
    #chat-bubble::after {
      content: 'CHAT';
    }
    #chat-popup {
      display: none; 
      position: fixed;
      bottom: 140px;
      right: 30px;
      width: 320px;
      max-height: 400px;
      background: #1a1a1a; 
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #50c878;
      overflow: hidden;
      z-index: 9998;
      font-family: 'Arial', sans-serif;
    }
    #chat-popup.active {
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      background: #2d5a27;
      padding: 15px;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid #50c878;
    }
    .chat-body {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #chat-popup label {
      font-weight: bold;
      color: #50c878;
    }
    #chat-popup input, #chat-popup textarea {
      width: 100%;
      background: #333;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      font-size: 1rem;
      box-sizing: border-box; 
    }
    #chat-popup textarea {
      height: 100px;
      resize: none;
    }
    #chat-popup button {
      padding: 12px;
      background: linear-gradient(to bottom, #50c878, #2d5a27);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 5px;
    }
    #chat-popup button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="chat-bubble" onclick="openChat()"></div>
  <div id="chat-popup">
    <div class="chat-header">Request a Call</div>
    <div class="chat-body">
      <form id="support-ticket-form">
        <label for="user-name">Your Name</label>
        <input type="text" id="user-name" name="user-name" required placeholder="Artist or Producer Name">
        <label for="user-message">Your Message / Question</label>
        <textarea id="user-message" name="user-message" required placeholder="What can we help you with?"></textarea>
        <button type="submit">Sound Shop Live Agent</button>
      </form>
    </div>
  </div>
  <script src="widget.js"></script>
</body>
</html>
