    <style>
        :root { --teal: #00ffcc; --dark: #050505; --glass: rgba(255, 255, 255, 0.05); --neon-pink: #ff00ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--dark); color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9998; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        .ticker { background: var(--teal); color: #000; padding: 6px 0; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; overflow: hidden; }
        .ticker-content { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        nav { padding: 20px; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; gap: 15px; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 255, 204, 0.2); }
        .logo { font-family: 'Syncopate', sans-serif; font-weight: 700; letter-spacing: 8px; font-size: 1.2rem; text-transform: uppercase; text-align: center; background: linear-gradient(to right, #fff 20%, var(--teal) 50%, #fff 80%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shine 4s linear infinite; }
        
        .nav-links { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .nav-links a { text-decoration: none; color: #fff; font-size: 0.5rem; letter-spacing: 1px; font-weight: 700; opacity: 0.6; transition: 0.3s; text-transform: uppercase; }
        .nav-links a:hover { opacity: 1; color: var(--teal); }

        .contact-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; background: rgba(0, 255, 204, 0.05); }
        .call-btn { flex: 1; text-align: center; padding: 12px; border: 1px solid var(--teal); color: var(--teal); text-decoration: none; border-radius: 5px; font-weight: 800; font-size: 0.7rem; letter-spacing: 1px; }
        .btn-order { background: var(--teal); color: #000; }

        .catalog-header { padding: 40px 20px; text-align: center; }
        .catalog-header h1 { font-family: 'Syncopate'; font-size: 1.8rem; letter-spacing: 5px; color: #fff; }
        .catalog-header p { font-size: 0.7rem; color: var(--teal); letter-spacing: 3px; margin-top: 10px; text-transform: uppercase; }

        .product-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .track-card { background: var(--glass); border: 1px solid rgba(0, 255, 204, 0.15); border-radius: 20px; padding: 25px; margin-bottom: 25px; backdrop-filter: blur(15px); border-left: 5px solid var(--teal); }
        
        .track-title { font-family: 'Syncopate'; font-size: 1rem; letter-spacing: 2px; color: #fff; margin-bottom: 5px; }
        .track-sku { font-size: 0.6rem; color: #666; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; }
        
        audio { width: 100%; height: 40px; margin: 15px 0; border-radius: 10px; filter: invert(1) hue-rotate(180deg) brightness(1.5); }
        .buy-btn { background: var(--teal); color: #000; border: none; padding: 16px; width: 100%; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }

        #paymentModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; justify-content:center; align-items:center; backdrop-filter: blur(10px); }
        .modal-content { background:#111; border: 1px solid var(--teal); padding:35px; border-radius:24px; width:90%; max-width:400px; text-align: center; }
        input { width:100%; padding:15px; margin:10px 0; border-radius:10px; border:1px solid #333; background:#1a1a1a; color:#fff; font-size: 1rem; }
        
        #toast { visibility: hidden; min-width: 250px; background-color: var(--teal); color: #000; text-align: center; border-radius: 5px; padding: 15px; position: fixed; z-index: 3000; bottom: 30px; left: 50%; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; }
        footer { padding: 40px 20px; background: #000; border-top: 1px solid rgba(0, 255, 204, 0.1); text-align: center; }
        .copyright { color: #333; font-size: 0.5rem; letter-spacing: 4px; }
    </style>
</head>
<body>

<div class="ticker">
    <div class="ticker-content">PREMIUM INSTRUMENTALS // SECURE PAYMENTS // RSA-2048 ENCRYPTED // ESTABLISHED 2026 //</div>
</div>

<nav>
    <div class="logo">SOUND SHOP</div>
    <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="studio.html">STUDIO</a>
        <a href="lab.html">THE LAB</a>
        <a href="vault.html">VAULT</a>
        <a href="portal.html">PORTAL</a>
        <a href="nexus.html">BROADCAST</a>
        <a href="about.html">ABOUT</a>
    </div>
</nav>

<div class="contact-bar">
    <a href="tel:19105499227" class="call-btn">OFFICE</a>
    <a href="tel:19108796800" class="call-btn btn-order">PLACE ORDER</a>
</div>

<div class="catalog-header">
    <h1>BEAT CATALOG</h1>
    <p>Professional M4A Audio Assets</p>
</div>

<div class="product-container" id="product-container"></div>

<div id="paymentModal">
    <div class="modal-content">
        <h3 id="modalTrackName" style="color:var(--teal); font-family: 'Syncopate';">Item</h3>
        <p id="modalPrice" style="font-weight: 900; font-size: 1.4rem; color: #fff; margin-bottom: 20px;">$0.00</p>
        <input type="email" id="customerEmail" placeholder="Email for Delivery">
        <div id="card-container"></div>
        <button class="buy-btn" id="card-button" type="button" onclick="handlePayment()">Secure Checkout</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#666; width:100%; margin-top:20px; cursor:pointer; text-transform: uppercase; font-weight: 800;">Cancel</button>
    </div>
</div>

<div id="toast"></div>

<footer>
    <div class="copyright">&copy; 2026 SOUND SHOP | FAYETTEVILLE NC | SECURE GATEWAY</div>
</footer>

<script>
    // Verified against your file screenshots to ensure filenames match storage exactly.
    const audioTracks = [
        { name: "Undefeated", price: "29.99", sku: "SKU-UND", file: "audio/undftd.m4a" },
        { name: "IJDGAF", price: "49.99", sku: "SKU-IJG", file: "audio/ijdgaf.m4a" },
        { name: "The Unknown", price: "34.99", sku: "SKU-UNK", file: "audio/theunknown.m4a" },
        { name: "No Mans Crown", price: "24.99", sku: "SKU-NMC", file: "audio/nmc.m4a" },
        { name: "Street Minded", price: "29.99", sku: "SKU-STR", file: "audio/strmnd.m4a" },
        { name: "First Mill", price: "34.99", sku: "SKU-FML", file: "audio/frstmill.m4a" },
        { name: "Crowned", price: "24.99", sku: "SKU-CRN", file: "audio/crnd.m4a" },
        { name: "High Rise", price: "24.99", sku: "SKU-HGR", file: "audio/highrise.m4a" },
        { name: "Botrix", price: "19.99", sku: "SKU-BTX", file: "audio/botrix.m4a" },
        { name: "Electro", price: "19.99", sku: "SKU-ELC", file: "audio/electro.m4a" },
        { name: "Wave Toxton", price: "29.99", sku: "SKU-WVT", file: "audio/wavetoxton.m4a" },
        { name: "Smoked", price: "24.99", sku: "SKU-SMK", file: "audio/gsmoke.m4a" },
        { name: "Fear Not", price: "24.99", sku: "SKU-FNT", file: "audio/fearnot.m4a" },
        { name: "Spaceroids", price: "29.99", sku: "SKU-SPD", file: "audio/spaceroids.m4a" },
        { name: "This Poppin", price: "19.99", sku: "SKU-TPP", file: "audio/thispoppin.m4a" },
        { name: "Grudge Gobbler", price: "14.99", sku: "SKU-TGG", file: "audio/tgg.m4a" },
        { name: "Empty Grave", price: "24.99", sku: "SKU-EGV", file: "audio/emptygrave.m4a" },
        { name: "Heavy Weight", price: "29.99", sku: "SKU-HHW", file: "audio/holdenhw.m4a" },
        { name: "The Rumbler", price: "24.99", sku: "SKU-RUM", file: "audio/rumbler.m4a" },
        { name: "Z-Bung", price: "19.99", sku: "SKU-ZBG", file: "audio/zjbng.m4a" },
        { name: "SM", price: "19.99", sku: "SKU-SMX", file: "audio/sm.m4a" },
        { name: "Poe", price: "14.99", sku: "SKU-POE", file: "audio/poe.m4a" },
        { name: "Creep", price: "19.99", sku: "SKU-CRP", file: "audio/creep.m4a" }
    ];

    const container = document.getElementById('product-container');
    audioTracks.forEach(track => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'track-card';
        cardDiv.innerHTML = `
            <div class="track-title">${track.name}</div>
            <div class="track-sku">${track.sku}</div>
            <audio controls preload="metadata" controlsList="nodownload"><source src="${track.file}" type="audio/mp4"></audio>
            <button class="buy-btn" onclick="openModal('${track.name}', '${track.price}', '${track.sku}')">LICENSE - $${track.price}</button>
        `;
        container.appendChild(cardDiv);
    });

    let currentOrder = {};
    let card; 

    async function initializeSquare() {
        try {
            const payments = Square.payments('sq0idp-65zuXXwmtAkENq9dLUBdiw', 'LMPQXX1');
            card = await payments.card();
            await card.attach('#card-container');
        } catch (e) { console.error('Square Load Error', e); }
    }
    initializeSquare();

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg; t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }

    function openModal(name, price, sku) {
        currentOrder = { name, price, sku };
        document.getElementById('modalTrackName').innerText = name;
        document.getElementById('modalPrice').innerText = '$' + price;
        document.getElementById('paymentModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('paymentModal').style.display = 'none'; }

    async function handlePayment() {
        const email = document.getElementById("customerEmail").value;
        if (!email) { showToast("Email required."); return; }
        document.getElementById('card-button').innerText = "PROCESSING...";
        try {
            const result = await card.tokenize();
            if (result.status === 'OK') { processCheckout(result.token); } 
            else { showToast("Card Error"); resetBtn(); }
        } catch (e) { showToast("Service Error"); resetBtn(); }
    }

    function resetBtn() {
        const btn = document.getElementById('card-button');
        btn.disabled = false; btn.innerText = "Secure Checkout";
    }

    async function processCheckout(token) {
        try {
            const res = await fetch('/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sourceId: token,
                    amount: currentOrder.price, 
                    customerEmail: document.getElementById("customerEmail").value,
                    items: [{ name: currentOrder.name, sku: currentOrder.sku }]
                })
            });
            const result = await res.json();
            if (result.success) { window.location.href = "success.html"; } 
            else { showToast(result.error); resetBtn(); }
        } catch (err) { showToast("Server Error"); resetBtn(); }
    }
</script>
</body>


</html>
