<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sound Shop | Entertainment Portal</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CQ81083J1M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date()); gtag('config', 'G-CQ81083J1M');
    </script>

    <style>
        :root { --teal: #00ffcc; --dark: #0a0a0a; }
        body { 
            background-color: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; text-align: center; 
            background-image: linear-gradient(rgba(0,0,0,0.95), rgba(0,0,0,0.95)), url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2000');
            background-size: cover; background-attachment: fixed;
        }

        nav { width: 100%; display: flex; justify-content: space-around; padding: 20px 0; background: rgba(0,0,0,0.95); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0, 255, 204, 0.2); backdrop-filter: blur(10px); }
        .nav-links a { color: #fff; text-decoration: none; font-weight: bold; font-size: 0.75rem; margin: 0 10px; text-transform: uppercase; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; padding: 20px; max-width: 1300px; margin: 0 auto; padding-bottom: 120px; }
        .portal-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; backdrop-filter: blur(15px); display: flex; flex-direction: column; height: 750px; }

        .emulator-container { 
            width: 100%; height: 400px; background-color: #000; border-radius: 12px; overflow: hidden; 
            position: relative; border: 2px solid var(--teal); box-shadow: 0 0 30px rgba(0,255,204,0.3);
            background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1000'); 
            background-size: cover;
        }

        /* --- Updated Voltage Static Animation --- */
        .static-voltage {
            position: absolute; 
            width: 60px; /* Discharge width (Left to Right) */
            height: 10px; /* Current thickness */
            background: transparent;
            /* Thick discharge with a heavy outer blur */
            border-bottom: 20px solid var(--teal); 
            filter: blur(10px); 
            opacity: 0.8;
            pointer-events: none;
            z-index: 1; /* Behind the overlay */
            animation: voltage_shimmer linear infinite;
        }

        @keyframes voltage_shimmer {
            0% { 
                transform: translateY(-50px) scaleX(1) scaleY(1); 
                opacity: 0; 
                filter: blur(10px) contrast(1);
            }
            10% { opacity: 0.9; }
            /* Randomize contrast and blur to create chaotic "spark" effect while floating down */
            25% { 
                transform: translateY(150px) scaleX(1.3) scaleY(0.7); 
                filter: blur(7px) contrast(1.5);
            }
            50% { 
                transform: translateY(300px) scaleX(0.8) scaleY(1.2); 
                filter: blur(12px) contrast(1.1);
            }
            75% { 
                transform: translateY(450px) scaleX(1.1) scaleY(0.9); 
                filter: blur(9px) contrast(1.3);
            }
            90% { opacity: 0.9; }
            100% { 
                transform: translateY(600px) scaleX(1) scaleY(1); 
                opacity: 0; 
                filter: blur(10px) contrast(1);
            }
        }

        #game-frame { width: 100%; height: 100%; border: none; background: transparent; position: relative; z-index: 2; }

        .game-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; height: 250px; overflow-y: scroll; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; }
        .game-menu::-webkit-scrollbar { width: 8px; }
        .game-menu::-webkit-scrollbar-thumb { background: var(--teal); border-radius: 10px; }

        .game-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 255, 204, 0.3); color: #fff; padding: 12px; border-radius: 8px; font-size: 0.7rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .game-btn:hover { background: var(--teal); color: #000; font-weight: bold; }
        
        .content-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; border: 1px solid var(--teal); overflow: hidden; }
    </style>
</head>
<body>

    <nav>
        <div id="admin-trigger" onclick="handleLogoClick()" style="color: var(--teal); font-weight: 900; font-style: italic; letter-spacing: 3px; cursor: pointer;">SOUND SHOP.</div>
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="catalog.html">BEATS</a>
            <a href="shop.html">GEAR</a>
            <a href="portal.html" style="color: var(--teal);">LOUNGE</a>
        </div>
    </nav>

    <h1 style="font-size: 2.5rem; margin: 30px 0; letter-spacing: 5px; font-weight: 900;">PORTAL GATEWAY</h1>

    <div class="grid-container">
        <div class="portal-card">
            <h3 style="color: var(--teal); margin-bottom: 15px; letter-spacing: 2px;">ARCADE TERMINAL</h3>
            <div class="emulator-container" id="terminal">
                
                <div class="static-voltage" style="left: 10%; animation-duration: 4s;"></div>
                <div class="static-voltage" style="left: 45%; animation-duration: 3s; animation-delay: 1.5s;"></div>
                <div class="static-voltage" style="left: 75%; animation-duration: 5s; animation-delay: 0.5s;"></div>
                
                <iframe id="game-frame" src="about:blank"></iframe>
                <div id="terminal-overlay" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--teal); font-family:monospace; background:rgba(0,0,0,0.85); padding:20px; border:2px solid var(--teal); pointer-events:none; z-index:10; text-align:center;">
                    <span style="font-size:1.2rem; font-weight:900;">[ SYSTEM READY ]</span><br>
                    <small style="opacity:0.7;">CHOOSE MODULE BELOW</small>
                </div>
            </div>
            
            <div class="game-menu" id="roster"></div>
        </div>

        <div class="portal-card">
            <h3 style="color: var(--teal); margin-bottom: 15px; letter-spacing: 2px;">CINEMA LOUNGE</h3>
            <div class="content-box">
                <iframe id="cinema-player" width="100%" height="100%" src="https://www.youtube.com/embed/GjZ_59hCrx0" frameborder="0" allowfullscreen></iframe>
            </div>
            <p style="font-size: 0.8rem; color: #aaa; margin: 20px 0;">Cinematic Sessions & Media Placements.</p>
            <div style="display:grid; grid-template-columns: 1fr; gap: 10px;">
                <button class="game-btn" onclick="switchVideo('GjZ_59hCrx0')">Studio Vision Reel</button>
                <button class="game-btn" onclick="switchVideo('dQw4w9WgXcQ')">Producer Showcase</button>
            </div>
        </div>
    </div>

    <script>
        const games = [
            { n: "Popeye", id: "10126-popeye-revision-d" },
            { n: "Dig Dug", id: "9140-dig-dug-set-1" },
            { n: "Centipede", id: "9053-centipede-revision-3" },
            { n: "Pac-Man", id: "9785-pac-man-midway" },
            { n: "Galaga", id: "9274-galaga-namco-set-1" },
            { n: "Frogger", id: "9253-frogger" },
            { n: "Street Fighter II", id: "10362-street-fighter-ii-the-world-warrior" },
            { n: "Sonic the Hedgehog", id: "10287-sonic-the-hedgehog-usa-europe" },
            { n: "Mario Bros", id: "9675-mario-bros-us-rev-f" },
            { n: "Out Run", id: "9779-out-run-sitdown-upright-rev-b" }
        ];

        const rosterDiv = document.getElementById('roster');
        games.forEach(g => {
            rosterDiv.innerHTML += `<button class="game-btn" onclick="loadGame('${g.id}')">${g.n}</button>`;
        });

        function loadGame(id) {
            document.getElementById('terminal-overlay').style.display = 'none';
            // Hide the static when game starts
            const staticCurrents = document.querySelectorAll('.static-voltage');
            staticCurrents.forEach(s => s.style.display = 'none');
            
            document.getElementById('game-frame').src = `https://www.retrogames.cc/embed/${id}.html`;
        }

        function switchVideo(id) {
            document.getElementById('cinema-player').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
        }
    </script>
</body>
</html>
