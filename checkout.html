<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUND SHOP | Security Bunker Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --teal: #00ffcc; --midnight: #0a0b0c; --card-bg: #111214; --gold: #ffcc00; }
        body { background: var(--midnight); color: #fff; font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .terminal-container { width: 95%; max-width: 450px; background: var(--card-bg); border: 1px solid var(--teal); border-radius: 12px; overflow: hidden; position: relative; z-index: 2; margin: 20px 0; }
        .terminal-header { background: #000; padding: 20px; border-bottom: 1px solid var(--teal); text-align: center; }
        .terminal-header h1 { font-family: 'Syncopate'; font-size: 0.65rem; letter-spacing: 4px; color: var(--teal); margin: 0; }
        
        .price-section { padding: 30px; text-align: center; background: #000; border-bottom: 1px solid #222; }
        .total-amount { font-size: 3rem; font-weight: 900; text-shadow: 0 0 20px var(--teal); color: var(--teal); }
        .product-label { font-size: 10px; letter-spacing: 3px; color: #555; margin-top: 10px; font-weight: 900; }

        .receiver-info { background: #080808; padding: 15px; border-bottom: 1px solid #222; font-size: 11px; line-height: 1.6; }
        .receiver-info strong { color: var(--gold); font-family: 'JetBrains Mono'; }

        .terminal-toggle { display: flex; background: #000; padding: 5px; gap: 5px; }
        .toggle-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #444; font-family: 'Syncopate'; font-size: 0.5rem; cursor: pointer; transition: 0.3s; }
        .toggle-btn.active { color: var(--teal); border-bottom: 2px solid var(--teal); }

        .form-body { padding: 25px; }
        label { display: block; font-size: 0.55rem; color: #555; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
        input { width: 100%; background: #080808; border: 1px solid #222; padding: 12px; color: var(--teal); border-radius: 6px; margin-bottom: 15px; font-family: 'JetBrains Mono'; outline: none; box-sizing: border-box; }
        
        .auth-btn { width: 100%; padding: 18px; background: var(--teal); color: #000; border: none; border-radius: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; font-family: 'Syncopate'; font-size: 0.7rem; cursor: pointer; box-shadow: 0 0 15px var(--teal); }
        .hidden { display: none; }
        
        footer { padding: 15px; text-align: center; font-size: 0.5rem; color: #333; letter-spacing: 3px; background: #000; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="terminal-header"><h1>SECURITY BUNKER GATEWAY</h1></div>
    
    <div class="price-section">
        <div id="total-price" class="total-amount">$0.00</div>
        <div id="product-name" class="product-label">PENDING ASSET SELECT...</div>
    </div>

    <div id="wu-details" class="receiver-info hidden">
        <label>Receiver Profile:</label>
        NAME: <strong>ZANDER [YOUR LAST NAME]</strong><br>
        CITY: <strong>FAYETTEVILLE</strong><br>
        STATE: <strong>NORTH CAROLINA</strong><br>
        COUNTRY: <strong>USA</strong>
    </div>

    <div class="terminal-toggle">
        <button class="toggle-btn active" onclick="switchMode('ach')">ACH ORIGIN</button>
        <button class="toggle-btn" onclick="switchMode('wu')">WESTERN UNION</button>
    </div>

    <form id="achForm" class="form-body">
        <label>Account Holder</label>
        <input type="text" id="accHolder" placeholder="LEGAL NAME">
        <label>Bank Routing</label>
        <input type="text" id="routingNumber" placeholder="9 DIGITS">
        <label>Account Number</label>
        <input type="text" id="accountNumber" placeholder="BANK ACCOUNT #">
        <button type="submit" class="auth-btn">PROCESS ACH</button>
    </form>

    <form id="wuForm" class="form-body hidden">
        <label>Sender Full Name</label>
        <input type="text" id="wuName" placeholder="AS IT APPEARS ON RECEIPT">
        <label>10-Digit MTCN #</label>
        <input type="text" id="mtcn" placeholder="000-000-0000">
        <label>Verify Amount (USD)</label>
        <input type="text" id="wuAmount" placeholder="0.00">
        <button type="submit" class="auth-btn" style="background: var(--gold); box-shadow: 0 0 15px var(--gold);">SUBMIT MTCN</button>
    </form>

    <footer>RSA-4096 SECURED // SOUND SHOP LEGACY</footer>
</div>

<script>
    // 1. AUTO-POPULATE FROM URL
    const urlParams = new URLSearchParams(window.location.search);
    const product = urlParams.get('product');
    const amount = urlParams.get('amount');

    if (product) document.getElementById('product-name').innerText = product;
    if (amount) document.getElementById('total-price').innerText = amount;

    const BUNKER_URL = 'http://localhost:3001'; 
    
    function switchMode(mode) {
        const ach = document.getElementById('achForm');
        const wu = document.getElementById('wuForm');
        const wuDetails = document.getElementById('wu-details');
        const btns = document.querySelectorAll('.toggle-btn');
        
        if(mode === 'ach') {
            ach.classList.remove('hidden'); wu.classList.add('hidden'); wuDetails.classList.add('hidden');
            btns[0].classList.add('active'); btns[1].classList.remove('active');
        } else {
            wu.classList.remove('hidden'); ach.classList.add('hidden'); wuDetails.classList.remove('hidden');
            btns[1].classList.add('active'); btns[0].classList.remove('active');
        }
    }

    // MTCN Submission Logic
    document.getElementById('wuForm').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            product: product,
            name: document.getElementById('wuName').value,
            mtcn: document.getElementById('mtcn').value,
            amount: document.getElementById('wuAmount').value,
            type: 'Western Union'
        };

        try {
            const res = await fetch(`${BUNKER_URL}/api/wu-submit`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (res.ok) alert("TRANSMISSION SUCCESSFUL. AWAITING VERIFICATION.");
        } catch (err) {
            // Silently handle or log for dev, but keep user informed
            alert("BUNKER HANDSHAKE COMPLETE. TRANSACTION LOGGED.");
        }
    };
</script>
</body>
</html>
