<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Sound Shop Vault</title>
    
    <script type="text/javascript" src="https://jstest.authorize.net/v1/Accept.js" charset="utf-8"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #000; 
            color: #fff; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 229, 255, 0.05) 0%, transparent 40%);
        }

        .checkout-header { 
            height: 250px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1514525253361-bee8a48790c7?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            border-bottom: 1px solid #00ffcc;
        }

        .checkout-header h1 { 
            font-size: 3rem; 
            letter-spacing: 15px; 
            text-transform: uppercase; 
            font-weight: 100;
            margin: 0;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.6); 
        }

        .checkout-header p {
            color: #00ffcc;
            letter-spacing: 5px;
            font-size: 0.7rem;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .checkout-container { 
            max-width: 1100px; 
            margin: -50px auto 100px; 
            padding: 0 20px; 
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px; 
        }

        .panel { 
            background: rgba(18, 18, 18, 0.8); 
            border: 1px solid rgba(0, 255, 204, 0.2); 
            backdrop-filter: blur(20px); 
            border-radius: 20px; 
            padding: 40px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        .total-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 2rem; 
            font-weight: 700; 
            margin-top: 30px; 
            color: #00ffcc;
            border-top: 2px solid #00ffcc;
            padding-top: 20px;
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 0.65rem; 
            color: #00ffcc; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            font-weight: 700;
        }

        input { 
            width: 100%; 
            padding: 18px; 
            margin-bottom: 25px; 
            background: #000; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 8px; 
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00ffcc;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        /* SIGNATURE PAD STYLING */
        #rim-signature-area {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            background: rgba(0, 255, 204, 0.05);
        }

        #rim-signature-area h3 {
            font-size: 0.8rem;
            color: #00ffcc;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        #rim-signature-area p {
            font-size: 0.7rem;
            margin-bottom: 15px;
            color: #ccc;
        }

        #sig-canvas {
            background: #fff;
            border-radius: 4px;
            width: 100%;
            height: 150px;
            touch-action: none; /* Prevents scrolling while signing */
            cursor: crosshair;
        }

        #sig-clearBtn {
            background: none;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 5px 10px;
            font-size: 0.6rem;
            margin-top: 10px;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .policy-agreement-container {
            margin: 0 0 25px 0;
            padding: 15px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #policy-check {
            width: 20px;
            height: 20px;
            margin-bottom: 0;
            cursor: pointer;
            accent-color: #00ffcc;
        }

        .policy-label {
            font-size: 0.75rem;
            color: #fff;
            text-transform: none;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-weight: 400;
        }

        .policy-label a { color: #00ffcc; text-decoration: underline; }

        .pay-btn { 
            width: 100%; 
            padding: 22px; 
            background: #333; 
            color: #777; 
            border: none; 
            border-radius: 4px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            cursor: not-allowed; 
            transition: 0.4s; 
        }

        @media (max-width: 900px) {
            .checkout-container { grid-template-columns: 1fr; margin-top: 20px; }
            .checkout-header h1 { font-size: 1.8rem; letter-spacing: 8px; }
        }
    </style>
</head>
<body>

<div class="checkout-header">
    <h1>SECURE VAULT</h1>
    <p>Sound Shop Licensing & Apparel</p>
</div>

<div class="checkout-container">
    <div class="order-summary panel">
        <h2 style="font-weight: 100; margin-bottom: 30px; letter-spacing: 3px;">YOUR SELECTION</h2>
        <div id="cart-list"></div>
        <div class="total-row">
            <span style="font-weight: 100;">TOTAL</span>
            <span id="final-price">$0.00</span>
        </div>
    </div>

    <div class="payment-details panel">
        <h2 style="font-weight: 100; margin-bottom: 30px; letter-spacing: 3px;">PAYMENT TERMINAL</h2>
        <form id="paymentForm">
            <label>Delivery Email</label>
            <input type="email" id="customerEmail" placeholder="STREET@MENTALITY.COM" required>

            <label>Cardholder Name</label>
            <input type="text" id="cardName" placeholder="AS APPEARS ON CARD" required>
            
            <label>Card Number</label>
            <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" required>
            
            <div style="display:flex; gap:15px">
                <div style="flex:1">
                    <label>MM</label>
                    <input type="text" id="expMonth" placeholder="01" maxlength="2" required>
                </div>
                <div style="flex:1">
                    <label>YY</label>
                    <input type="text" id="expYear" placeholder="26" maxlength="2" required>
                </div>
                <div style="flex:1">
                    <label>CVC</label>
                    <input type="text" id="cardCode" placeholder="***" maxlength="4" required>
                </div>
            </div>

            <div id="rim-signature-area" style="display:none;">
                <h3>Custom Rim Agreement</h3>
                <p>A 50% Non-Refundable deposit is required. All sales final on rims. Sign below:</p>
                <canvas id="sig-canvas"></canvas>
                <button type="button" id="sig-clearBtn">Clear Signature</button>
            </div>

            <div class="policy-agreement-container">
                <input type="checkbox" id="policy-check">
                <label for="policy-check" class="policy-label">
                    I agree to the <a href="refund.html" target="_blank">Refund & Return Policy</a>.
                </label>
            </div>

            <button type="button" class="pay-btn" id="submitBtn" onclick="sendPaymentToAuthorize()" disabled>Authorize Transaction</button>
        </form>
    </div>
</div>

<script>
    // 1. GLOBAL VARIABLES
    const policyCheck = document.getElementById('policy-check');
    const submitBtn = document.getElementById('submitBtn');
    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    let isSigning = false;
    let hasSigned = false;
    let rimsInCart = false;

    // 2. LOAD CART & CHECK FOR RIMS
    window.onload = function() {
        const cartData = JSON.parse(localStorage.getItem('cart')) || [];
        const listDiv = document.getElementById('cart-list');
        let total = 0;
        
        if(cartData.length === 0) { 
            listDiv.innerHTML = "<p style='color:#666; text-transform: uppercase; font-size: 0.7rem;'>Vault is empty.</p>"; 
        } else {
            cartData.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                const price = parseFloat(item.price) || 0;
                
                // CHECK IF ITEM IS A RIM (Check name or category)
                if (item.name.toLowerCase().includes('rim')) {
                    rimsInCart = true;
                }

                itemDiv.innerHTML = `
                    <span style="letter-spacing: 1px;">${item.name.toUpperCase()}</span>
                    <span style="color: #00ffcc;">$${price.toFixed(2)}</span>
                `;
                listDiv.appendChild(itemDiv);
                total += price;
            });
        }
        document.getElementById('final-price').innerText = "$" + total.toFixed(2);

        // Show Signature box if rims are detected
        if (rimsInCart) {
            document.getElementById('rim-signature-area').style.display = 'block';
            resizeCanvas();
        }
    };

    // 3. SIGNATURE LOGIC
    function resizeCanvas() {
        // Adjust canvas internal resolution to match display size
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchmove', draw);
    window.addEventListener('mouseup', stopDrawing);
    window.addEventListener('touchend', stopDrawing);

    function startDrawing(e) {
        isSigning = true;
        const pos = getMousePos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }

    function draw(e) {
        if (!isSigning) return;
        const pos = getMousePos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.stroke();
        hasSigned = true;
        validateForm();
        e.preventDefault();
    }

    function stopDrawing() { isSigning = false; }

    document.getElementById('sig-clearBtn').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasSigned = false;
        validateForm();
    });

    // 4. FORM VALIDATION (Checkbox + Signature)
    function validateForm() {
        const isPolicyChecked = policyCheck.checked;
        const needsSignature = rimsInCart;
        
        // Button unlocks ONLY if policy is checked AND (if it's a rim) they have signed
        const canSubmit = isPolicyChecked && (!needsSignature || hasSigned);

        if (canSubmit) {
            submitBtn.disabled = false;
            submitBtn.style.background = "#00ffcc";
            submitBtn.style.color = "#000";
            submitBtn.style.cursor = "pointer";
            submitBtn.style.boxShadow = "0 0 30px rgba(0, 255, 204, 0.4)";
        } else {
            submitBtn.disabled = true;
            submitBtn.style.background = "#333";
            submitBtn.style.color = "#777";
            submitBtn.style.cursor = "not-allowed";
            submitBtn.style.boxShadow = "none";
        }
    }

    policyCheck.addEventListener('change', validateForm);

    // 5. AUTHORIZE.NET HANDSHAKE
    function sendPaymentToAuthorize() {
        if (rimsInCart && !hasSigned) {
            alert("Please provide a signature for your rim order.");
            return;
        }

        const email = document.getElementById('customerEmail').value;
        if (!email.includes('@')) { return alert("Input valid delivery email."); }

        const btn = document.getElementById('submitBtn');
        btn.innerText = "ENCRYPTING...";
        btn.disabled = true;

        const authData = {
            clientKey: "7Fv2GSGNx3274kZ9tgFk98DgvRSeuKnCCAkMN57gkfh5PB64F3yqUHmQE667pq3P",
            apiLoginID: "43cLv2Jb"
        };

        const cardData = {
            cardNumber: document.getElementById("cardNumber").value.replace(/\s+/g, ''),
            month: document.getElementById("expMonth").value,
            year: document.getElementById("expYear").value,
            cardCode: document.getElementById("cardCode").value,
            fullName: document.getElementById("cardName").value
        };

        Accept.dispatchData({ authData, cardData }, responseHandler);
    }

    function responseHandler(response) {
        if (response.messages.resultCode === "Error") {
            resetButton();
            alert("AUTH ERROR: " + response.messages.message[0].text);
        } else {
            const cartData = JSON.parse(localStorage.getItem('cart')) || [];
            const email = document.getElementById('customerEmail').value;
            const totalStr = document.getElementById('final-price').innerText.replace('$', '');
            
            // Capture signature image as Base64 to send to backend
            const signatureImage = rimsInCart ? canvas.toDataURL() : null;

            const paymentData = {
                dataDescriptor: response.opaqueData.dataDescriptor,
                dataValue: response.opaqueData.dataValue,
                amount: totalStr,
                items: cartData,
                customerEmail: email,
                signature: signatureImage // THIS SAVES THE SIGNATURE
            };
            sendPaymentToBackend(paymentData);
        }
    }

    async function sendPaymentToBackend(paymentData) {
        const tunnelUrl = 'https://paperback-conflict-finances-jean.trycloudflare.com/checkout';

        try {
            const response = await fetch(tunnelUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paymentData)
            });
            const data = await response.json();
            
            if (data.success) {
                localStorage.removeItem('cart');
                window.location.href = `success.html?orderId=${data.orderId}`;
            } else {
                alert('TRANSACTION DECLINED: ' + data.error);
                resetButton();
            }
        } catch (error) {
            alert('NETWORK ERROR: Check Termux Tunnel.');
            resetButton();
        }
    }

    function resetButton() {
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Authorize Transaction";
        validateForm();
    }
</script>
</body>
</html>
