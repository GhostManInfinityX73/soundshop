<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUND SHOP | Infrastructure</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;900&display=swap" rel="stylesheet">
    <style>
        :root { --teal: #00ffcc; --dark: #050505; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--dark); color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9998; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        .ticker { background: var(--teal); color: #000; padding: 6px 0; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; overflow: hidden; }
        .ticker-content { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        nav { padding: 20px; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; gap: 15px; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 255, 204, 0.2); }
        .logo { font-family: 'Syncopate', sans-serif; font-weight: 700; letter-spacing: 8px; font-size: 1.2rem; text-transform: uppercase; text-align: center; background: linear-gradient(to right, #fff 20%, var(--teal) 50%, #fff 80%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shine 4s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }

        .nav-links { display: flex; justify-content: center; gap: 20px; }
        .nav-links a { text-decoration: none; color: #fff; font-size: 0.6rem; letter-spacing: 2px; font-weight: 700; opacity: 0.5; }

        .contact-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; background: rgba(0, 255, 204, 0.05); }
        .call-btn { flex: 1; text-align: center; padding: 12px; border: 1px solid var(--teal); color: var(--teal); text-decoration: none; border-radius: 5px; font-weight: 800; font-size: 0.7rem; letter-spacing: 1px; }
        .btn-order { background: var(--teal); color: #000; }

        .hero { height: 35vh; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .hero-video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translateX(-50%) translateY(-50%); z-index: 1; filter: brightness(0.25); }
        .hero-overlay { position: absolute; z-index: 2; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, transparent 20%, var(--dark) 90%); }
        .hero h1 { position: relative; z-index: 3; font-family: 'Syncopate', sans-serif; font-size: 2.2rem; font-weight: 700; text-align: center; }

        .video-wrapper { width: 90%; max-width: 800px; margin: 30px auto; border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 15px; overflow: hidden; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .featured-container { padding: 20px; max-width: 900px; margin: 0 auto 40px; }
        .section-header { font-family: 'Syncopate'; font-size: 0.7rem; letter-spacing: 5px; text-align: center; margin-bottom: 25px; color: var(--teal); }

        .track-card { background: var(--glass); border: 1px solid rgba(0, 255, 204, 0.15); border-radius: 20px; padding: 25px; margin-bottom: 30px; backdrop-filter: blur(15px); border-left: 5px solid var(--teal); display: flex; flex-direction: column; gap: 15px; }
        .track-title { font-family: 'Syncopate'; font-size: 0.85rem; letter-spacing: 2px; }
        .track-controls { display: flex; gap: 10px; }
        
        .play-btn { flex: 1; background: transparent; color: var(--teal); border: 1px solid var(--teal); padding: 15px; border-radius: 10px; font-weight: 900; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; }
        .license-btn { flex: 2; background: var(--teal); color: #000; border: none; padding: 15px; border-radius: 10px; font-weight: 900; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }

        #payment-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20000; justify-content: center; align-items: center; }
        .modal-content { background: #111; border: 1px solid var(--teal); padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; }
        .modal-header { font-family: 'Syncopate'; font-size: 0.8rem; color: var(--teal); margin-bottom: 20px; }
        .modal-input { width: 100%; background: #000; border: 1px solid #333; padding: 15px; color: #fff; margin-bottom: 10px; border-radius: 5px; font-family: 'Inter'; }

        #chat-bubble { position: fixed; bottom: 25px; right: 25px; background: var(--teal); width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 9999; box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); }
        #toast { visibility: hidden; min-width: 200px; background-color: var(--teal); color: #000; text-align: center; border-radius: 5px; padding: 15px; position: fixed; z-index: 10000; bottom: 100px; left: 50%; transform: translateX(-50%); font-weight: bold; font-size: 0.7rem; }
        #toast.show { visibility: visible; }
        footer { padding: 40px; text-align: center; color: #444; font-size: 0.5rem; letter-spacing: 4px; border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="ticker">
    <div class="ticker-content">AUTHENTIC INFRASTRUCTURE // ESTABLISHED 2026 // VAULT CORE ARMED // PORT 3001 ACTIVE //</div>
</div>

<nav>
    <div class="logo">SOUND SHOP</div>
    <div class="nav-links">
        <a href="index.html" style="color: var(--teal); opacity: 1;">HOME</a>
        <a href="catalog.html">CATALOG</a>
        <a href="shop.html">GEAR</a>
        <a href="lab.html">LAB</a>
    </div>
</nav>

<div class="contact-bar">
    <a href="tel:19105499227" class="call-btn" onclick="showToast('Connecting to Office...')">OFFICE</a>
    <a href="tel:19108796800" class="call-btn btn-order" onclick="showToast('Direct Ordering Line...')">PLACE ORDER</a>
</div>

<div class="hero">
    <video autoplay muted loop playsinline class="hero-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-vj-loop-with-blue-and-green-lights-42588-large.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <h1>SOUND<br>SHOP</h1>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/b4EX0kljru8" allowfullscreen></iframe>
    </div>
</div>

<div class="featured-container">
    <div class="section-header">CORE ASSETS</div>

    <div class="track-card">
        <div class="track-title">GRUDGE GOBBLER</div>
        <audio id="audio-grudge"><source src="audio/tgg.m4a" type="audio/mp4"></audio>
        <div class="track-controls">
            <button class="play-btn" onclick="togglePlay('audio-grudge', this)">Play Preview</button>
            <button class="license-btn" onclick="openPaymentModal('GRUDGE GOBBLER', 19.99)">LICENSE - $19.99</button>
        </div>
    </div>

    <div class="track-card">
        <div class="track-title">ELECTRO VISE</div>
        <audio id="audio-electro"><source src="audio/electro.m4a" type="audio/mp4"></audio>
        <div class="track-controls">
            <button class="play-btn" onclick="togglePlay('audio-electro', this)">Play Preview</button>
            <button class="license-btn" onclick="openPaymentModal('ELECTRO VISE', 24.99)">LICENSE - $24.99</button>
        </div>
    </div>

    <div class="track-card">
        <div class="track-title">THIS POPPIN</div>
        <audio id="audio-poppin"><source src="audio/thispoppin.m4a" type="audio/mp4"></audio>
        <div class="track-controls">
            <button class="play-btn" onclick="togglePlay('audio-poppin', this)">Play Preview</button>
            <button class="license-btn" onclick="openPaymentModal('THIS POPPIN', 24.99)">LICENSE - $24.99</button>
        </div>
    </div>
</div>

<div id="payment-modal">
    <div class="modal-content">
        <div class="modal-header" id="modal-title">SECURE GATEWAY</div>
        <input type="text" id="card-num" class="modal-input" placeholder="CARD NUMBER">
        <div style="display:flex; gap:10px;">
            <input type="text" id="card-exp" class="modal-input" placeholder="MM/YY">
            <input type="text" id="card-cvv" class="modal-input" placeholder="CVV">
        </div>
        <button class="license-btn" style="width:100%; margin-top:10px;" onclick="initiateVaultHandshake()">AUTHORIZE VAULT</button>
        <button class="play-btn" style="width:100%; border:none; margin-top:10px;" onclick="closeModal()">CANCEL</button>
    </div>
</div>

<div id="chat-bubble" onclick="showToast('Opening Support...')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
</div>

<div id="toast">Action Logged</div>

<footer>&copy; 2026 SOUND SHOP | NORTH CAROLINA | RSA-4096 PROTECTED</footer>

<script>
    let currentItem = { title: "", price: 0 };

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg; t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }

    function togglePlay(id, btn) {
        const audio = document.getElementById(id);
        const allAudios = document.querySelectorAll('audio');
        const allBtns = document.querySelectorAll('.play-btn');

        if (audio.paused) {
            allAudios.forEach(a => { a.pause(); a.currentTime = 0; });
            allBtns.forEach(b => b.innerText = "Play Preview");
            audio.play().catch(e => showToast("Source not detected."));
            btn.innerText = "Pause Preview";
        } else {
            audio.pause();
            btn.innerText = "Play Preview";
        }
    }

    function openPaymentModal(title, price) {
        currentItem = { title, price };
        document.getElementById('modal-title').innerText = `LICENSE: ${title}`;
        document.getElementById('payment-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('payment-modal').style.display = 'none';
    }

    /**
     * UPDATED HANDSHAKE:
     * Connects directly to tokenizer.js on Port 3001
     * and maps metadata for the ISO-8583 Processor.
     */
    async function initiateVaultHandshake() {
        const cardData = {
            number: document.getElementById('card-num').value,
            exp: document.getElementById('card-exp').value,
            cvv: document.getElementById('card-cvv').value
        };

        showToast("VAULT CORE: ENCRYPTING DATA...");

        try {
            const response = await fetch('http://localhost:3001/tokenize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cardData: cardData,
                    amount: currentItem.price,
                    meta: currentItem.title
                })
            });

            const result = await response.json();

            if (result.status === "SECURE") {
                showToast(`VAULT AUTHORIZED: ${result.authCode}`);
                console.log("Infrastructure Log:", {
                    token: result.token.substring(0, 10) + "...",
                    stan: result.stan,
                    auth: result.authCode
                });
                setTimeout(closeModal, 2000);
            } else {
                showToast("VAULT ERROR: Authorization Failed.");
            }
        } catch (err) {
            console.error(err);
            showToast("INFRASTRUCTURE OFFLINE: Check Port 3001");
        }
    }
</script>
</body>
</html>
