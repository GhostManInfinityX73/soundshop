<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Confirmed | Sound Shop</title>
    <style>
        body { 
            background: #050505; 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(10, 10, 10, 0.95);
            padding: 50px;
            border-radius: 20px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            max-width: 500px;
        }
        h1 { color: #00ffcc; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; }
        .ethic-tag { color: #28a745; font-style: italic; font-size: 0.9rem; margin-bottom: 20px; }
        p { color: #ccc; line-height: 1.6; }
        .download-btn {
            display: inline-block;
            margin-top: 25px;
            background: linear-gradient(90deg, #00ffcc, #00c6ff);
            color: #000;
            padding: 15px 40px;
            text-decoration: none;
            font-weight: 900;
            border-radius: 50px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .download-btn:hover {
            box-shadow: 0 0 20px #00ffcc;
            transform: scale(1.05);
        }
        #status-msg { font-size: 0.85rem; color: #00ffcc; margin-top: 15px; font-weight: bold; }
        #order-id { font-size: 0.75rem; color: #444; margin-top: 20px; font-family: monospace; }
        .back-home { display: block; margin-top: 30px; color: #00ffcc; text-decoration: none; font-size: 0.8rem; opacity: 0.6; }
        .back-home:hover { opacity: 1; }
    </style>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CQ81083J1M">
</script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-CQ81083J1M');
</script>
</head>
<body>
    <div class="container">
        <h1>Payment Verified</h1>
        <div class="ethic-tag">"Good business is the only business we do."</div>
        
        <p>Your transaction was successful. Your high-quality audio file is being prepared for download.</p>
        
        <a href="#" id="downloadLink" class="download-btn">Preparing Download...</a>
        
        <div id="status-msg"></div>
        <p id="order-id"></p>
        
        <a href="index.html" class="back-home">Return to Sound Shop Home</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            
            // 1. Grab the secure Download URL (from our checkout redirect)
            const downloadUrl = urlParams.get('downloadUrl');
            
            // 2. Grab the Transaction ID (just for display purposes)
            const transId = urlParams.get('transId');

            const linkElem = document.getElementById('downloadLink');
            const statusElem = document.getElementById('status-msg');

            if (transId) {
                document.getElementById('order-id').innerText = "TRANS_ID: " + transId;
            }

            if (downloadUrl) {
                // Set the link manually just in case they need to click it
                linkElem.href = downloadUrl;
                linkElem.innerText = "Download Track";
                
                statusElem.innerText = "ðŸ“¥ Your download will start automatically in a moment...";

                // 3. Automatic Trigger: Wait 2.5 seconds then start download
                setTimeout(() => {
                    window.location.href = downloadUrl;
                }, 2500);
            } else {
                linkElem.innerText = "Check Email for Link";
                linkElem.style.opacity = "0.5";
                statusElem.innerText = "No secure token detected.";
                statusElem.style.color = "#ff4444";
            }
        });
    </script>
</body>
</html>
