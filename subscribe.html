<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe | Sound Shop</title>
    
    <link rel="stylesheet" href="./style.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CQ81083J1M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CQ81083J1M');
    </script> <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;300;700&display=swap');
        
        body { 
            background: #020202; color: #fff; font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            margin: 0; overflow: hidden;
        }

        /* Matches your Shop background */
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 40px; border-radius: 30px; backdrop-filter: blur(20px);
            width: 100%; max-width: 400px; text-align: center;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        input[type="text"], input[type="email"] {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333;
            background: #111; color: #fff; margin-top: 5px;
        }

        .submit-btn {
            background: #00ffcc; color: #000; border: none; padding: 15px 30px;
            border-radius: 50px; font-weight: 700; cursor: pointer; width: 100%;
            transition: 0.3s; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        .submit-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="grid-bg"></div>

<section id="subscription-container">
    <div class="form-card">
        <h2 style="font-weight: 100; letter-spacing: 5px;">THE INNER CIRCLE</h2>
        <p style="color: #666; font-size: 0.8rem; margin-bottom: 30px;">GET THE DROP ON GEAR & SOUNDTRACKS</p>
        
        <form id="sub-form">
            <div class="input-group">
                <input type="text" id="user-name" name="first_name" placeholder="First Name" required>
            </div>

            <div class="input-group">
                <input type="email" id="user-email" name="email" placeholder="Email Address" required>
            </div>

            <button type="submit" class="submit-btn">KEEP ME POSTED</button>
        </form>
    </div>
</section>

<script>
    document.getElementById('sub-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const formContainer = document.querySelector('.form-card');
        const name = document.getElementById('user-name').value;

        formContainer.innerHTML = `
            <h2 style="color: #00ffcc;">LOCKED IN, ${name.toUpperCase()}!</h2>
            <p style="color: #888; margin-top: 10px;">Check your inbox for the next drop.</p>
            <button onclick="location.reload()" class="submit-btn" style="margin-top: 20px;">BACK</button>
        `;
    });
</script>

</body>
</html>
