<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundShop Chatroom</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100%; height: 100vh; background: #01040a; overflow: hidden; }

        .video-bg { 
            position: fixed; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            object-fit: cover; z-index: -1; 
        }

        .master-nav-console { 
            width: 100%; 
            padding: 15px 10px; 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            background: rgba(0, 0, 0, 0.4); 
            z-index: 10;
        }

        .nav-link {
            font-family: sans-serif;
            font-size: 0.85rem; 
            color: #d4af37;
            text-decoration: none;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
        }

        .title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            z-index: 10;
        }

        .header-title { font-family: sans-serif; font-size: 1.5rem; letter-spacing: 2px; }
        .header-title a { color: #d4af37; text-decoration: none; }
        .payment-notice { font-family: sans-serif; font-size: 0.7rem; color: #b8860b; margin-top: 5px; opacity: 0.8; }

        /* Orbit System */
        .orbit-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 300px; height: 300px;
            transform: translate(-50%, -50%);
        }

        .orbit-ring {
            width: 100%; height: 100%;
            border-radius: 50%;
            animation: rotateOrbit 40s linear infinite;
        }

        .node {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            margin: -30px 0 0 -30px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            font-size: 0.6rem;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
        }

        .node:hover { background: rgba(212, 175, 55, 0.2); transform: scale(1.1); }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Footer System */
        .footer-bar {
            position: fixed;
            bottom: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .footer-link {
            color: #d4af37;
            font-family: sans-serif;
            font-size: 0.7rem;
            text-decoration: underline;
            opacity: 0.8;
        }

        .membership-btn {
            background: #d4af37;
            color: #000;
            padding: 8px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            transition: background 0.3s;
        }

        .membership-btn:hover { background: #b8860b; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg">
        <source src="star.mp4" type="video/mp4">
    </video>

    <nav class="master-nav-console">
        <a href="index.html" class="nav-link">Home</a>
        <a href="lab.html" class="nav-link">Lab</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="nexus.html" class="nav-link">Nexus</a>
        <a href="about.html" class="nav-link">About Us</a>
        <a href="services.html" class="nav-link">Services</a>
    </nav>

    <div class="title-wrapper">
        <h1 class="header-title">
            <a href="https://www.westernunion.com" target="_blank">SOUNDSHOP CHATROOM</a>
        </h1>
        <p class="payment-notice">Click to pay membership via Western Union</p>
    </div>
<div class="orbit-container">
        <div class="orbit-ring">
            <a href="lounge.html" class="node" style="transform: rotate(0deg) translate(140px) rotate(0deg);">Lounge</a>
            <a href="religious.html" class="node" style="transform: rotate(32.7deg) translate(140px) rotate(-32.7deg);">Religious</a>
            <a href="arts.html" class="node" style="transform: rotate(65.4deg) translate(140px) rotate(-65.4deg);">Arts</a>
            <a href="music.html" class="node" style="transform: rotate(98.1deg) translate(140px) rotate(-98.1deg);">Music</a>
            <a href="ideas.html" class="node" style="transform: rotate(130.8deg) translate(140px) rotate(-130.8deg);">Ideas</a>
            <a href="entrepreneurs.html" class="node" style="transform: rotate(163.5deg) translate(140px) rotate(-163.5deg);">Entrepreneurs</a>
            <a href="relationship.html" class="node" style="transform: rotate(196.2deg) translate(140px) rotate(-196.2deg);">Relationship</a>
            <a href="friends.html" class="node" style="transform: rotate(228.9deg) translate(140px) rotate(-228.9deg);">Friends</a>
            <a href="business.html" class="node" style="transform: rotate(261.6deg) translate(140px) rotate(-261.6deg);">Business</a>
            <a href="entertainment.html" class="node" style="transform: rotate(294.3deg) translate(140px) rotate(-294.3deg);">Entertainment</a>
            <a href="political.html" class="node" style="transform: rotate(327deg) translate(140px) rotate(-327deg);">Political</a>
        </div>
    </div>
</div>


    <footer class="footer-bar">
        <a href="rules.html" class="footer-link">Rules & Regulations</a>
        <a href="https://www.westernunion.com" target="_blank" class="membership-btn">Join Membership - $9.95/mo</a>
    </footer>

</body>
</html>
