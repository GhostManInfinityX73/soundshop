<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360° GEAR VAULT | SOUND SHOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --teal: #00e5ff; 
            --dark: #050505; 
            --gold: #ffd700; 
            --glass: rgba(255, 255, 255, 0.03); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            /* Aggressive perspective to force the deep spherical 360 curve */
            perspective: 800px; 
            -webkit-font-smoothing: antialiased;
        }

        .shop-header { 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(0,0,0,0.95); 
            position: relative; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(0,229,255,0.1); 
        }
        .logo { font-family: 'Syncopate'; font-size: 0.9rem; letter-spacing: 4px; }
        .logo span { color: var(--teal); }

        .category-header { 
            text-align: center; 
            font-family: 'Syncopate'; 
            font-size: 0.7rem; 
            color: var(--teal); 
            letter-spacing: 5px; 
            margin-top: 50px; 
            text-transform: uppercase; 
        }

        /* 360° DEEP ORBIT STAGE */
        .stage { 
            height: 420px; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            transform-style: preserve-3d;
            margin-bottom: 20px;
        }

        .carousel { 
            position: relative; 
            width: 160px; 
            height: 240px; 
            transform-style: preserve-3d; 
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        
        .item { 
            position: absolute; 
            width: 160px; 
            height: 240px; 
            background: var(--glass); 
            border: 1px solid rgba(0, 229, 255, 0.12); 
            border-radius: 16px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 12px; 
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            transition: border-color 0.3s, box-shadow 0.3s, opacity 0.3s;
            backface-visibility: hidden;
        }

        .item:hover { 
            border-color: var(--teal); 
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3); 
        }

        .item img { 
            width: 100%; 
            height: 140px; 
            object-fit: cover; 
            border-radius: 10px; 
            margin-bottom: 12px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .item h3 { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 1px; color: var(--teal); text-align: center; line-height: 1.3; height: 30px; display: flex; align-items: center; }
        .item .price { color: var(--gold); font-weight: 900; font-size: 0.85rem; margin-top: 4px; }

        .nav-btns { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin-bottom: 50px; 
            position: relative; 
            z-index: 500; 
        }
        .nav-btns button { 
            background: rgba(5, 5, 5, 0.8); 
            border: 1px solid rgba(0, 229, 255, 0.4); 
            color: var(--teal); 
            padding: 10px 24px; 
            border-radius: 50px; 
            font-weight: 900; 
            font-size: 0.7rem; 
            cursor: pointer; 
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .nav-btns button:hover {
            background: var(--teal);
            color: #000;
            border-color: var(--teal);
        }

        /* HARDWARE SYSTEM MODAL */
        #product-modal { 
            display: none; 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 85vh; 
            background: #070708; 
            border-top: 2px solid var(--teal); 
            border-radius: 24px 24px 0 0; 
            z-index: 2000; 
            padding: 30px; 
            overflow-y: auto; 
            box-shadow: 0 -15px 40px rgba(0,0,0,0.9);
        }
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 1500; 
            backdrop-filter: blur(12px); 
        }
        .modal-img { 
            width: 100%; 
            max-height: 280px;
            object-fit: cover;
            border-radius: 16px; 
            border: 1px solid rgba(0, 229, 255, 0.2); 
            margin-bottom: 20px; 
        }
        .buy-btn { 
            width: 100%; 
            padding: 20px; 
            background: var(--teal); 
            color: #000; 
            border: none; 
            border-radius: 14px; 
            font-weight: 900; 
            text-transform: uppercase; 
            margin-top: 24px; 
            letter-spacing: 2px; 
            cursor: pointer;
            transition: 0.2s;
        }
        .buy-btn:hover { background: var(--gold); }
    </style>
</head>
<body>

    <header class="shop-header">
        <div class="logo">SOUND<span>SHOP</span></div>
        <div style="color: var(--teal); font-weight: 900; font-size: 0.7rem; letter-spacing: 2px;">360° INFRASTRUCTURE</div>
    </header>

    <div class="category-header">CLOTHING & HEADWEAR</div>
    <div class="stage"><div class="carousel" id="clothing-carousel"></div></div>
    <div class="nav-btns">
        <button onclick="rotate('clothing', -1)">PREV</button>
        <button onclick="rotate('clothing', 1)">NEXT</button>
    </div>

    <div class="category-header">FOOTWEAR ENGINE</div>
    <div class="stage"><div class="carousel" id="footwear-carousel"></div></div>
    <div class="nav-btns">
        <button onclick="rotate('footwear', -1)">PREV</button>
        <button onclick="rotate('footwear', 1)">NEXT</button>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closeProduct()"></div>
    <div id="product-modal">
        <img src="" id="m-img" class="modal-img">
        <h2 id="m-title" style="font-family: 'Syncopate'; font-size: 1.1rem; color: var(--teal);"></h2>
        <p id="m-price" style="color: var(--gold); font-weight: 900; font-size: 1.4rem; margin: 10px 0;"></p>
        <p id="m-desc" style="font-size: 0.85rem; color: #aaa; line-height: 1.6;"></p>
        
        <label style="color: var(--teal); font-size: 0.6rem; font-weight: 900; margin-top: 20px; display: block; letter-spacing: 1px;">CHOOSE YOUR SIZE SPECIFICATION</label>
        <select id="size-select" style="width:100%; padding:18px; background:#121214; color:white; border:1px solid rgba(0,229,255,0.2); margin-top:10px; border-radius: 12px; outline:none; font-weight:bold;"></select>
        
        <button class="buy-btn" onclick="processOrder()">BUY VIA WESTERN UNION</button>
        <button onclick="closeProduct()" style="width:100%; background:transparent; border:none; color:#555; margin-top:20px; font-size:0.7rem; letter-spacing:1px; cursor:pointer; text-transform:uppercase;">BACK TO INFRASTRUCTURE</button>
    </div>

    <script>
        // System Network Matrix Target Context
        const CONFIG = {
            TUNNEL_URL: "https://profits-briefing-estates-getting.trycloudflare.com"
        };

        const products = {
            clothing: [
                { name: "NJJC Hoodie", price: 75, img: "images/njjc.jpg", sizes: ["S","M","L","XL","2XL"], desc: "Official NJJC street-grade heavy hoodie." },
                { name: "SMR Showcase", price: 65, img: "images/smrshowcase.jpg", sizes: ["S","M","L","XL"], desc: "Limited edition SMR Showcase series." },
                { name: "Black TNW Beanie", price: 35, img: "images/blktbnw.jpg", sizes: ["One Size"], desc: "High-profile 'That Shit Don't Hold No Weight' beanie." }, 
                { name: "White TNW Beanie", price: 35, img: "images/whttbnw.jpg", sizes: ["One Size"], desc: "Premium White embroidery street beanie." },
                { name: "SMR Black Cap", price: 40, img: "images/smrblkcpsg.jpg", sizes: ["Adjustable"], desc: "Official Sound Shop Records structured cap." },
                { name: "SMR White Cap", price: 40, img: "images/smrwhtcp.jpg", sizes: ["Adjustable"], desc: "Clean white edition SMR headwear." }
            ],
            footwear: [
                { name: "SMR CS Black", price: 130, img: "images/smrcsblk.jpg", sizes: ["8","9","10","11","12"], desc: "SMR Clean Black Court Shoes." },
                { name: "SMR CS White", price: 130, img: "images/smrcs.jpg", sizes: ["8","9","10","11","12"], desc: "SMR Clean White Court Shoes." },
                { name: "SMR Black Gold", price: 155, img: "images/smrfgblkgld.jpg", sizes: ["9","10","11","12"], desc: "Elite Fashion Sneaker with Gold hardware." },
                { name: "Shadow Runner", price: 140, img: "images/smrtr.jpg", sizes: ["8.5","10","11"], desc: "Dynamic shadow-mesh performance runner." },
                { name: "J-Z Beach Boot", price: 165, img: "images/j_zbeach.jpg", sizes: ["9","10","11","12"], desc: "All-terrain J-Z urban tactical boot." }
            ]
        };

        let angles = { clothing: 0, footwear: 0 };
        let activeProduct = null;

        // Background logging transmitter connecting directly into Security Bunker shell
        async function transmitStorefrontTelemetry(actionTag, payloadDetails) {
            try {
                await fetch(`${CONFIG.TUNNEL_URL}/log-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    mode: 'cors',
                    body: JSON.stringify({
                        item: actionTag,
                        amount: payloadDetails
                    })
                });
            } catch (err) {
                console.error("⚠️ Local data tracking stream decoupled from Bunker logs:", err);
            }
        }

        // DEEP DYNAMIC SPATIAL CURVE CALCULATOR
        function initCarousel(type) {
            const container = document.getElementById(`${type}-carousel`);
            const items = products[type];
            const itemCount = items.length;
            const angleStep = 360 / itemCount;
            
            const itemWidth = 160; 
            const calculatedRadius = Math.round((itemWidth / 2) / Math.tan(Math.PI / itemCount)) + 40; 

            items.forEach((p, i) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.style.transform = `rotateY(${i * angleStep}deg) translateZ(${calculatedRadius}px)`;
                itemDiv.onclick = () => openProduct(p, type);
                itemDiv.innerHTML = `<img src="${p.img}"><h3>${p.name}</h3><div class="price">$${p.price}</div>`;
                container.appendChild(itemDiv);
            });
        }

        function rotate(type, dir) {
            const container = document.getElementById(`${type}-carousel`);
            const step = 360 / products[type].length;
            angles[type] -= (dir * step);
            container.style.transform = `rotateY(${angles[type]}deg)`;

            transmitStorefrontTelemetry("Storefront Deck Shift", `User rotated ${type} wheel carousel array [Target Sector Angle: ${angles[type]}deg]`);
        }

        function openProduct(p, type) {
            activeProduct = p;
            document.getElementById('m-img').src = p.img;
            document.getElementById('m-title').innerText = p.name;
            document.getElementById('m-price').innerText = `$${p.price}`;
            document.getElementById('m-desc').innerText = p.desc;
            
            const s = document.getElementById('size-select');
            s.innerHTML = p.sizes.map(size => `<option value="${size}">${size}</option>`).join('');
            
            document.getElementById('product-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';

            transmitStorefrontTelemetry("Storefront Item Opened", `Client activated modal drawer for: ${p.name} inside category cluster: ${type}`);
        }

        function closeProduct() {
            if (activeProduct) {
                transmitStorefrontTelemetry("Storefront Item Retracted", `Client folded item detail panel for: ${activeProduct.name}`);
            }
            document.getElementById('product-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        async function processOrder() {
            const size = document.getElementById('size-select').value;
            const orderPayload = {
                item: activeProduct.name,
                price: activeProduct.price,
                size: size
            };
            
            localStorage.setItem('wu_order', JSON.stringify(orderPayload));

            await transmitStorefrontTelemetry(
                "Storefront Transaction Redirect", 
                `User checkout trigger committed for: ${activeProduct.name} (Size: ${size}) totaling $${activeProduct.price}.00 via Western Union.`
            );

            window.location.href = 'checkout.html';
        }

        // ECHO KILLER & COMPONENT INITIALIZATION MATRIX
        window.onload = () => { 
            try {
                // Instantly scrub any rogue audio or video elements cached by QuickEdit's preview compiler
                const strayMediaNodes = document.querySelectorAll('audio, video');
                strayMediaNodes.forEach(node => {
                    node.pause();
                    node.currentTime = 0;
                    node.src = "";
                    node.load();
                    node.remove();
                });

                // Terminate background audio pipelines to secure zero-echo performance
                if (window.AudioContext || window.webkitAudioContext) {
                    const trackingCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (trackingCtx.state === 'running') trackingCtx.close();
                }
            } catch (error) {
                console.log("Pre-render environment media flush complete.");
            }

            // Build shop layouts cleanly
            initCarousel('clothing'); 
            initCarousel('footwear'); 
            
            transmitStorefrontTelemetry("Storefront Core Online", "360 Gear Vault viewport module successfully initialized and audio layers sandboxed.");
        };
    </script>
</body>
</html>
