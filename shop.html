<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360° GLOBE VAULT | SOUND SHOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --teal: #00e5ff; --dark: #050505; --gold: #ffd700; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            perspective: 1200px; /* Reduced perspective for tighter mobile feel */
        }

        .shop-header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.95); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0,229,255,0.1); }
        .logo { font-family: 'Syncopate'; font-size: 0.7rem; letter-spacing: 3px; }
        .logo span { color: var(--teal); }

        .category-header { text-align: center; font-family: 'Syncopate'; font-size: 0.5rem; color: var(--teal); letter-spacing: 3px; margin-top: 20px; text-transform: uppercase; }

        /* DOWNSIZED STAGE */
        .stage { 
            height: 280px; /* Reduced from 400px to fit mobile screen */
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            transform-style: preserve-3d;
        }

        .globe-wrap-top { transform: rotateX(15deg); transform-style: preserve-3d; }
        .globe-wrap-bottom { transform: rotateX(-15deg); transform-style: preserve-3d; }

        .carousel { 
            position: relative; 
            width: 120px; /* Shorter width */
            height: 180px; /* Shorter height */
            transform-style: preserve-3d; 
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        
        .item { 
            position: absolute; 
            width: 120px; 
            height: 180px; 
            background: var(--glass); 
            border: 1px solid rgba(0, 229, 255, 0.15); 
            border-radius: 10px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 5px; 
            backface-visibility: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .item img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; margin-bottom: 5px; background: #111; }
        .item h3 { font-size: 0.45rem; text-transform: uppercase; letter-spacing: 1px; color: var(--teal); text-align: center; }
        .item .price { color: var(--gold); font-weight: 900; font-size: 0.6rem; margin-top: 2px; }

        /* ACCESSIBLE BUTTONS */
        .nav-btns { display: flex; justify-content: center; gap: 15px; margin-top: 5px; margin-bottom: 30px; position: relative; z-index: 500; }
        .nav-btns button { 
            background: rgba(0,0,0,0.7); border: 1px solid var(--teal); color: var(--teal); 
            padding: 8px 18px; border-radius: 50px; font-weight: 900; font-size: 0.6rem; 
            cursor: pointer; backdrop-filter: blur(5px);
        }

        #product-modal { display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: 80vh; background: #0a0a0a; border-top: 3px solid var(--teal); border-radius: 20px 20px 0 0; z-index: 2000; padding: 20px; overflow-y: auto; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1500; backdrop-filter: blur(10px); }
        .modal-img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 10px; border: 1px solid #333; margin-bottom: 15px; }
        .buy-btn { width: 100%; padding: 15px; background: var(--teal); color: #000; border: none; border-radius: 10px; font-weight: 900; text-transform: uppercase; margin-top: 15px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header class="shop-header">
        <div class="logo">SOUND<span>SHOP</span></div>
        <div style="color: var(--teal); font-weight: 900; font-size: 0.4rem; letter-spacing: 1px;">GLOBAL INFRASTRUCTURE</div>
    </header>

    <div class="category-header">CLOTHING (NORTH)</div>
    <div class="stage">
        <div class="globe-wrap-top">
            <div class="carousel" id="clothing-carousel"></div>
        </div>
    </div>
    <div class="nav-btns">
        <button onclick="rotate('clothing', -1)">PREV</button>
        <button onclick="rotate('clothing', 1)">NEXT</button>
    </div>

    <div class="category-header">FOOTWEAR (SOUTH)</div>
    <div class="stage">
        <div class="globe-wrap-bottom">
            <div class="carousel" id="footwear-carousel"></div>
        </div>
    </div>
    <div class="nav-btns">
        <button onclick="rotate('footwear', -1)">PREV</button>
        <button onclick="rotate('footwear', 1)">NEXT</button>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closeProduct()"></div>
    <div id="product-modal">
        <img src="" id="m-img" class="modal-img">
        <h2 id="m-title" style="font-family: 'Syncopate'; font-size: 0.9rem; color: var(--teal);"></h2>
        <p id="m-price" style="color: var(--gold); font-weight: 900; font-size: 1.2rem; margin: 8px 0;"></p>
        <p id="m-desc" style="font-size: 0.75rem; color: #aaa; line-height: 1.5;"></p>
        <button class="buy-btn" onclick="processOrder()">BUY VIA WESTERN UNION</button>
    </div>

    <script>
        const products = {
            clothing: [
                { name: "NJJC Hoodie", price: 75, img: "images/njjc.jpg", desc: "Official NJJC street-grade heavy hoodie." },
                { name: "SMR Showcase", price: 65, img: "images/smrshowcase.jpg", desc: "Limited edition SMR Showcase series." },
                { name: "Black TNW Beanie", price: 35, img: "images/blktbnw.jpg", desc: "High-profile 'That Shit Don't Hold No Weight' beanie." }, 
                { name: "White TNW Beanie", price: 35, img: "images/whttbnw.jpg", desc: "White embroidery street beanie." },
                { name: "SMR Black Cap", price: 40, img: "images/smrblkcpsg.jpg", desc: "Sound Shop Records structured cap." },
                { name: "SMR White Cap", price: 40, img: "images/smrwhtcp.jpg", desc: "Clean white edition SMR headwear." }
            ],
            footwear: [
                { name: "SMR CS Black", price: 130, img: "images/smrcsblk.jpg", desc: "SMR Clean Black Court Shoes." },
                { name: "SMR CS White", price: 130, img: "images/smrcs.jpg", desc: "SMR Clean White Court Shoes." },
                { name: "SMR Black Gold", price: 155, img: "images/smrfgblkgld.jpg", desc: "Elite Fashion Sneaker with Gold hardware." },
                { name: "Shadow Runner", price: 140, img: "images/smrtr.jpg", desc: "Performance runner." },
                { name: "J-Z Beach Boot", price: 165, img: "images/j_zbeach.jpg", desc: "J-Z urban tactical boot." }
            ]
        };

        let angles = { clothing: 0, footwear: 0 };

        function initCarousel(type) {
            const container = document.getElementById(`${type}-carousel`);
            const items = products[type];
            const angleStep = 360 / items.length;
            const radius = 220; // Reduced radius for mobile

            items.forEach((p, i) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.style.transform = `rotateY(${i * angleStep}deg) translateZ(${radius}px)`;
                itemDiv.innerHTML = `
                    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/120x110/050505/00e5ff?text=SOUND+SHOP'">
                    <h3>${p.name}</h3>
                    <div class="price">$${p.price}</div>
                `;
                itemDiv.onclick = () => openProduct(p);
                container.appendChild(itemDiv);
            });
        }

        function rotate(type, dir) {
            const container = document.getElementById(`${type}-carousel`);
            const step = 360 / products[type].length;
            angles[type] -= (dir * step);
            container.style.transform = `rotateY(${angles[type]}deg)`;
        }

        function openProduct(p) {
            document.getElementById('m-img').src = p.img;
            document.getElementById('m-title').innerText = p.name;
            document.getElementById('m-price').innerText = `$${p.price}`;
            document.getElementById('m-desc').innerText = p.desc;
            document.getElementById('product-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeProduct() {
            document.getElementById('product-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function processOrder() {
            const item = document.getElementById('m-title').innerText;
            alert(`ORDER LOGGED: ${item}. Call (910) 549-9227 for Western Union verification.`);
        }

        window.onload = () => { initCarousel('clothing'); initCarousel('footwear'); };
    </script>
</body>
</html>
