<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUND SHOP | PRODUCT DETAIL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@100;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --teal: #00ffcc;
            --brand-yellow: #ffd700;
            --midnight: #0a0b0c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--midnight); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        nav { 
            padding: 20px; 
            background: rgba(10, 11, 12, 0.95); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            border-bottom: 1px solid rgba(0, 255, 204, 0.2); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { 
            font-family: 'Syncopate', sans-serif; 
            font-weight: 700; 
            letter-spacing: 8px; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            text-align: center; 
            color: var(--teal); 
        }

        .container { padding: 40px 20px; max-width: 1000px; margin: 0 auto; min-height: 100vh; }
        
        .product-display { display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px; }
        
        .product-image-container { flex: 1.2; min-width: 300px; }
        .product-image-container img { 
            width: 100%; 
            border-radius: 20px; 
            border: 1px solid rgba(0, 255, 204, 0.3); 
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15);
        }

        .product-info { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .product-title { 
            font-family: 'Syncopate'; 
            font-size: 1.6rem; 
            letter-spacing: 4px; 
            color: var(--teal); 
            text-transform: uppercase; 
        }
        .product-price { font-size: 2rem; font-weight: 900; color: var(--brand-yellow); }
        .product-desc { 
            color: #aaa; 
            font-size: 0.95rem; 
            line-height: 1.7; 
            border-left: 3px solid var(--teal); 
            padding-left: 20px;
        }

        .option-group { margin-top: 15px; }
        .option-label { 
            font-size: 0.75rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-bottom: 12px; 
            display: block; 
            color: var(--teal); 
            font-weight: 700; 
        }
        
        select {
            width: 100%;
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #fff;
            border-radius: 12px;
            font-family: 'Inter';
            outline: none;
            appearance: none;
        }

        .buy-btn {
            background: var(--teal);
            color: #000;
            padding: 24px;
            text-align: center;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 15px;
            margin-top: 25px;
            transition: 0.3s;
            display: block;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .buy-btn:hover { 
            background: var(--brand-yellow); 
            transform: translateY(-5px); 
        }

        .wu-disclaimer {
            font-size: 0.65rem; 
            color: #777; 
            text-align: center; 
            margin-top: 20px; 
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }

        .back-link { color: #666; text-decoration: none; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 30px; display: block; }
    </style>
</head>
<body>

<nav>
    <div class="logo">SOUND SHOP</div>
</nav>

<div class="container">
    <a href="catalog.html" class="back-link">← BACK TO CATALOG</a>
    
    <div class="product-display">
        <div class="product-image-container">
            <!-- FIXED IMAGE URL BELOW -->
            <img id="product-img" src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80" alt="Sound Shop High Performance Gear">
        </div>

        <div class="product-info">
            <h1 id="product-name" class="product-title">LOADING PRODUCT...</h1>
            <div id="product-price" class="product-price">$ --.--</div>
            
            <p class="product-desc" id="product-desc">
                Fetching the latest details from the Sound Shop database...
            </p>
            
            <div class="option-group">
                <label class="option-label" id="option-header">SELECT OPTION</label>
                <select id="size-select">
                    <option value="" disabled selected>CHOOSE YOUR SPECIFICATIONS</option>
                </select>
            </div>

            <!-- WESTERN UNION CALL TO ACTION -->
            <button onclick="initiateCheckout()" class="buy-btn">CHECKOUT VIA WESTERN UNION</button>
            
            <div class="wu-disclaimer">
                OFFICIAL WESTERN UNION PAYMENT GATEWAY<br>
                SECURED BY SOUND SHOP BUNKER PORT 3001
            </div>
        </div>
    </div>
</div>

<script>
    const products = {
        "black-pullover": { 
            name: "Black Pullover Hoodie", 
            price: "$85.00", 
            img: "blkplhsmr.jpg", 
            type: "apparel",
            desc: "Heavyweight premium fleece. Custom Sound Shop heritage cut. Features reinforced stitching for high-impact wear."
        },
        "optical-zip": { 
            name: "Optical Zip Hoodie", 
            price: "$110.00", 
            img: "blkzhoptcn.jpg", 
            type: "apparel",
            desc: "Advanced optical-thread construction. Reflective Sound Shop detailing for visibility and performance."
        },
        "heritage-boot": { 
            name: "Heritage Boot", 
            price: "$185.00", 
            img: "j_zbeach.jpg", 
            type: "shoe",
            desc: "The original Sound Shop silhouette. Hand-crafted rugged leather with industrial traction outsoles."
        },
        "black-low": { 
            name: "SMR Black Low", 
            price: "$145.00", 
            img: "blkltps.jpg", 
            type: "shoe",
            desc: "Low-profile aesthetic meeting professional durability. Lightweight chassis with custom heel support."
        },
        "rim-a": { 
            name: "Initialized Rim: A", 
            price: "$1,500/EA", 
            img: "rimz_a.jpg", 
            type: "rim",
            desc: "Custom-forged aluminum. Precision-milled 'A' structural spoke. Engineered for maximum performance."
        },
        "rim-b": { 
            name: "Initialized Rim: B", 
            price: "$1,500/EA", 
            img: "rimz_b.jpg", 
            type: "rim",
            desc: "Signature alphabet series 'B'. Lightweight alloy construction with custom aerospace finish."
        },
        "SKU-UND": { 
            name: "UNDFTD Soundtrack", 
            price: "$25.00", 
            img: "undftd_cover.jpg", 
            type: "audio",
            desc: "High-fidelity digital license. Produced in-house at Sound Shop for high-energy environments."
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    const select = document.getElementById('size-select');

    if (productId && products[productId]) {
        const item = products[productId];
        
        document.getElementById('product-name').innerText = item.name;
        document.getElementById('product-price').innerText = item.price;
        // Only updates if the local image file is found, otherwise keeps the fixed top image
        if(item.img.includes('.')) document.getElementById('product-img').src = item.img;
        document.getElementById('product-desc').innerText = item.desc;

        if (item.type === "shoe") {
            document.getElementById('option-header').innerText = "SELECT SIZE (8-13)";
            let sizes = ["US 8", "US 8.5", "US 9", "US 9.5", "US 10", "US 10.5", "US 11", "US 12", "US 13"];
            sizes.forEach(sz => {
                let opt = document.createElement("option");
                opt.value = sz; opt.text = sz;
                select.appendChild(opt);
            });
        } 
        else if (item.type === "apparel") {
            document.getElementById('option-header').innerText = "SELECT SIZE (S-3XL)";
            let sizes = ["SMALL", "MEDIUM", "LARGE", "X-LARGE", "XX-LARGE", "XXX-LARGE"];
            sizes.forEach(sz => {
                let opt = document.createElement("option");
                opt.value = sz; opt.text = sz;
                select.appendChild(opt);
            });
        } 
        else if (item.type === "rim") {
            document.getElementById('option-header').innerText = "WHEEL CONFIGURATION";
            let configs = ["20 INCH", "22 INCH", "24 INCH"];
            configs.forEach(cfg => {
                let opt = document.createElement("option");
                opt.value = cfg; opt.text = cfg;
                select.appendChild(opt);
            });
        }
        else {
            let opt = document.createElement("option");
            opt.value = "STANDARD"; opt.text = "STANDARD DIGITAL LICENSE";
            select.appendChild(opt);
        }
    }

    function initiateCheckout() {
        const selectedOption = select.value;
        if (!selectedOption) {
            alert("Please select your size/option before proceeding to Western Union checkout.");
            return;
        }
        window.location.href = `vault.html?id=${productId}&option=${encodeURIComponent(selectedOption)}&gateway=WU`;
    }
</script>
</body>
</html>
