<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUND SHOP | PRODUCT DETAIL</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@100;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --teal: #00ffcc; --brand-yellow: #ffd700; --midnight: #0a0b0c; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--midnight); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        nav { padding: 20px; background: rgba(10, 11, 12, 0.95); border-bottom: 1px solid rgba(0, 255, 204, 0.2); position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Syncopate', sans-serif; font-weight: 700; letter-spacing: 8px; font-size: 1.2rem; text-align: center; color: var(--teal); }
        .container { padding: 40px 20px; max-width: 1000px; margin: 0 auto; min-height: 100vh; }
        .product-display { display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px; }
        .product-image-container { flex: 1.2; min-width: 300px; }
        .product-image-container img { width: 100%; border-radius: 20px; border: 1px solid rgba(0, 255, 204, 0.3); aspect-ratio: 1 / 1; object-fit: cover; }
        .product-info { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .product-title { font-family: 'Syncopate'; font-size: 1.6rem; letter-spacing: 4px; color: var(--teal); text-transform: uppercase; }
        .product-price { font-size: 2rem; font-weight: 900; color: var(--brand-yellow); }
        .product-desc { color: #aaa; font-size: 0.95rem; line-height: 1.7; border-left: 3px solid var(--teal); padding-left: 20px; }
        .option-group { margin-top: 15px; }
        .option-label { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; display: block; color: var(--teal); font-weight: 700; }
        select { width: 100%; padding: 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 255, 204, 0.4); color: #fff; border-radius: 12px; cursor: pointer; }
        .buy-btn { background: var(--teal); color: #000; padding: 24px; text-align: center; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; border-radius: 15px; margin-top: 25px; border: none; cursor: pointer; width: 100%; transition: 0.3s; }
        .buy-btn:hover { background: var(--brand-yellow); transform: translateY(-5px); }
        .wu-disclaimer { font-size: 0.65rem; color: #777; text-align: center; margin-top: 20px; border: 1px solid rgba(255, 215, 0, 0.2); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<nav><div class="logo">SOUND SHOP</div></nav>

<div class="container">
    <div class="product-display">
        <div class="product-image-container">
            <img id="product-img" src="" alt="Product View">
        </div>
        <div class="product-info">
            <h1 id="product-name" class="product-title">INITIALIZING...</h1>
            <div id="product-price" class="product-price">--.--</div>
            <p id="product-desc" class="product-desc">Connecting to secure database...</p>
            <div class="option-group">
                <label id="option-header" class="option-label">SELECT SPECIFICATION</label>
                <select id="size-select" onchange="reportOptionSelection()"></select>
            </div>
            <button onclick="initiateCheckout()" class="buy-btn">CHECKOUT VIA WESTERN UNION</button>
            <div class="wu-disclaimer">OFFICIAL WESTERN UNION PAYMENT GATEWAY<br>SECURED BY SOUND SHOP BUNKER PORT 3001</div>
        </div>
    </div>
</div>

<script>
    const CONFIG = { TUNNEL_URL: "https://bunker.soundshop.cc" };

    const products = {
        "black-pullover": { 
            name: "Street Mentality Studio Hoodie", 
            price: "$85.00", 
            img: "blkplhsmr.jpg", 
            type: "apparel",
            desc: "The definitive Street Mentality Records edition. Featuring a full-wrap studio design, professional-grade fleece, and master-level detailing. Designed for the dedicated creator."
        },
        "optical-zip": { name: "Optical Zip Hoodie", price: "$110.00", img: "blkzhoptcn.jpg", type: "apparel", desc: "Advanced optical-thread construction. Reflective Sound Shop detailing for visibility and performance." },
        "heritage-boot": { name: "Heritage Boot", price: "$185.00", img: "j_zbeach.jpg", type: "shoe", desc: "The original Sound Shop silhouette. Hand-crafted rugged leather with industrial traction outsoles." },
        "black-growing": { name: "SMR Black Low", price: "$145.00", img: "blkltps.jpg", type: "shoe", desc: "Low-profile aesthetic meeting professional durability. Lightweight chassis with custom heel support." },
        "rim-a": { name: "Initialized Rim: A", price: "$1,500/EA", img: "rimz_a.jpg", type: "rim", desc: "Custom-forged aluminum. Precision-milled 'A' structural spoke. Engineered for maximum performance." },
        "rim-b": { name: "Initialized Rim: B", price: "$1,500/EA", img: "rimz_b.jpg", type: "rim", desc: "Signature alphabet series 'B'. Lightweight alloy construction with custom aerospace finish." },
        "SKU-UND": { name: "UNDFTD Soundtrack", price: "$25.00", img: "undftd_cover.jpg", type: "audio", desc: "High-fidelity digital license. Produced in-house at Sound Shop for high-energy environments." }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id') || "black-pullover";
    const activeItem = products[productId];
    const select = document.getElementById('size-select');

    async function logDetailTelemetry(action, payload) {
        try {
            await fetch(`${CONFIG.TUNNEL_URL}/log-payment`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                mode: 'cors', 
                body: JSON.stringify({ item: action, amount: payload }) 
            });
        } catch (err) { console.error("Telemetry offline.", err); }
    }

    function renderProductView() {
        if (!activeItem) { document.getElementById('product-name').innerText = "ITEM UNAVAILABLE"; return; }
        
        document.getElementById('product-name').innerText = activeItem.name.toUpperCase();
        document.getElementById('product-price').innerText = activeItem.price;
        document.getElementById('product-desc').innerText = activeItem.desc;
        document.getElementById('product-img').src = activeItem.img;

        if (activeItem.type === "shoe") {
            document.getElementById('option-header').innerText = "SELECT SIZE (8-13)";
            ["US 8", "US 9", "US 10", "US 11", "US 12", "US 13"].forEach(sz => { let opt = document.createElement("option"); opt.value = sz; opt.text = sz; select.appendChild(opt); });
        } else if (activeItem.type === "apparel") {
            document.getElementById('option-header').innerText = "SELECT SIZE (S-3XL)";
            ["SMALL", "MEDIUM", "LARGE", "X-LARGE", "XX-LARGE"].forEach(sz => { let opt = document.createElement("option"); opt.value = sz; opt.text = sz; select.appendChild(opt); });
        } else {
            document.getElementById('option-header').innerText = "LICENSE SPECIFICATION";
            let opt = document.createElement("option"); opt.value = "STANDARD"; opt.text = "STANDARD DIGITAL LICENSE"; select.appendChild(opt);
        }
        logDetailTelemetry("Product Rendered", `Loaded: ${activeItem.name}`);
    }

    function reportOptionSelection() { logDetailTelemetry("Option Selected", select.value); }

    async function initiateCheckout() {
    const selectedOption = select.value;
    
    if (!selectedOption) {
        alert("Please select a specification.");
        return;
    }

    // Handshake payload
    const checkoutRequest = {
        productId: productId,
        option: selectedOption,
        gateway: "WU"
    };

    try {
        const response = await fetch(`${CONFIG.TUNNEL_URL}/api/checkout/initialize`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(checkoutRequest)
        });

        const data = await response.json();

        if (response.ok && data.transactionToken) {
            await logDetailTelemetry("Checkout Handshake Success", data.transactionToken);
            window.location.href = `vault.html?token=${data.transactionToken}`;
        } else {
            throw new Error('Handshake failed.');
        }
    } catch (err) {
        console.error("Checkout error:", err);
        alert("Secure gateway unreachable.");
        await logDetailTelemetry("Checkout Handshake Failed", err.message);
    }
}
    window.onload = renderProductView;
</script>
</body>
</html>
