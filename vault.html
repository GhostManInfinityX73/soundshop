<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault | Sound Shop Access</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&display=swap');
        :root { --teal: #00ffcc; --dark: #020202; }
        
        body { margin:0; background: var(--dark); color:#fff; font-family:'Inter', sans-serif; overflow-x:hidden; }
        
        /* Navigation - Matches index.html */
        nav { padding: 20px; background: rgba(0, 0, 0, 0.9); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 255, 204, 0.2); }
        .logo { font-weight: 900; letter-spacing: 3px; font-size: 1rem; text-transform: uppercase; font-style: italic; }
        .logo span { color: var(--teal); }
        .nav-links a { text-decoration: none; color: #fff; font-size: 0.65rem; margin-left: 10px; letter-spacing: 1px; font-weight: 700; opacity: 0.6; }
        .nav-links a:hover { opacity: 1; color: var(--teal); }

        .grid-bg { position:fixed; top:0; left:0; width:100%; height:100%; background-image:linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px); background-size: 50px 50px; transform: perspective(500px) rotateX(60deg); z-index:-1; }
        
        .vault-header { padding: 60px 20px; text-align:center; }
        h1 { font-weight:100; letter-spacing:15px; font-size:3rem; margin:0; text-transform: uppercase; }
        .user-id { color: var(--teal); font-size:0.7rem; letter-spacing:3px; margin-top:10px; opacity:0.6; font-weight: 700; }

        .file-grid { max-width:1200px; margin:0 auto; padding:20px; display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px; }
        .file-card { background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); padding:30px; border-radius:24px; transition:0.3s; position: relative; overflow: hidden; }
        .file-card:hover { border-color: var(--teal); background:rgba(0,255,204,0.02); transform:translateY(-5px); }
        
        .file-name { font-weight:700; font-size:1.2rem; margin-bottom:5px; display:block; color: #fff; }
        .file-type { color:#555; font-size:0.7rem; text-transform:uppercase; letter-spacing:2px; display: block; margin-bottom: 10px; }
        
        .dl-btn { display:inline-block; margin-top:20px; padding:12px 25px; background: var(--teal); color:#000; text-decoration:none; border-radius:50px; font-weight:900; font-size:0.75rem; transition:0.3s; text-transform: uppercase; border: none; cursor: pointer; }
        .dl-btn:hover { box-shadow:0 0 20px rgba(0,255,204,0.4); transform: scale(1.05); }

        footer { text-align: center; padding: 40px; opacity: 0.3; font-size: 0.6rem; letter-spacing: 2px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">SOUND<span>SHOP</span></div>
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="catalog.html">BEATS</a>
            <a href="vault.html" style="color: var(--teal); opacity: 1;">LOUNGE</a>
        </div>
    </nav>

    <div class="grid-bg"></div>
    
    <div class="vault-header">
        <h1>THE VAULT</h1>
        <div class="user-id" id="display-email">AUTHENTICATING...</div>
    </div>

    <div class="file-grid" id="file-container">
        </div>

    <footer>ACCESS GRANTED // MMXXVI</footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email') || "GUEST_USER";
        document.getElementById('display-email').innerText = `SESSION_ID: ${userEmail.toUpperCase()}`;

        // Example Library
        const library = [
            { name: "Cinematic Atmosphere Pack Vol 1", type: "WAV / 24-bit", file: "atmos_v1.zip" },
            { name: "808 Street Kit (Legacy Edition)", type: "Drum Kit / MIDI", file: "808_street.zip" },
            { name: "Orchestral Strings - Staccato", type: "Instrument Pack", file: "strings_stac.zip" }
        ];

        const container = document.getElementById('file-container');
        library.forEach(item => {
            container.innerHTML += `
                <div class="file-card">
                    <span class="file-type">${item.type}</span>
                    <span class="file-name">${item.name}</span>
                    <a href="downloads/${item.file}" class="dl-btn" onclick="logActivity('${item.name}')">DOWNLOAD FILE</a>
                </div>
            `;
        });

        function logActivity(fileName) {
            console.log("Logging download for: " + fileName);
            // Optional: Connect to your local Termux server
            fetch('http://localhost:3000/api/log-activity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: userEmail,
                    action: 'DOWNLOAD',
                    item: fileName,
                    timestamp: new Date()
                })
            }).catch(err => console.log("Offline mode: Activity not logged to server."));
        }
    </script>
</body>
</html>
